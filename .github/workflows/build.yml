name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: both jobs only ever check the repo out and
# compile it. Without this the token inherits the repository default, which can
# be write-all — a compromised action or dependency could then push to main.
# Any future job that needs more (releases, packages) must opt in explicitly.
permissions:
  contents: read

# Pinned llama.cpp build tag. Local llama-staging is build 8274
# (libllama.so.0.0.8274), but upstream never tagged b8273–b8275, so we
# pin the nearest tag at or below it. Bump this to move synapd to a
# newer llama.cpp; the cache key follows it automatically.
env:
  LLAMA_REF: b10241

jobs:
  # ── Fast structural guards (no toolchain) ──────────────────
  # Catches the regressions the repo just recovered from: tracked build
  # artifacts, absolute/dangling symlinks, and meson sources that were
  # never committed.
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No tracked build artifacts
        run: |
          hits=$(git ls-files \
            | grep -E '\.(pkg\.tar\.zst|o|ko|cmd|symvers)$|(^|/)pkg/|/src/[A-Za-z0-9_]+-0\.1\.0/|^llama-staging/|^archiso/build/' \
            || true)
          if [ -n "$hits" ]; then
            echo "::error::tracked build artifacts must not be committed:"; echo "$hits"; exit 1
          fi
          echo "ok: no tracked build artifacts"

      - name: No symlinks leaking a local checkout path
        run: |
          # Guards the regression we fixed: makepkg-dropped symlinks pointing
          # at an absolute developer path (/home/.../SYNAPSE). Legitimate
          # systemd .wants/ symlinks into /usr and /etc are fine.
          fail=0
          while IFS= read -r l; do
            [ -z "$l" ] && continue
            tgt=$(readlink "$l")
            case "$tgt" in
              /home/*|/Users/*|/root/*|*/SYNAPSE/*|*/GitHub/*)
                echo "::error::symlink leaks a local checkout path: $l -> $tgt"; fail=1 ;;
            esac
          done < <(git ls-files -s | awk '$1=="120000"{ $1=$2=$3=""; sub(/^   /,""); print }')
          [ "$fail" -eq 0 ] && echo "ok: no checkout-path symlinks"
          exit $fail

      # ⚠ EVERY component with a meson.build, not the five that CI compiles.
      #
      # This check exists for one failure and it just happened for real: a
      # commit staged `meson.build` for an unrelated change and swept in a
      # line naming `src/scope.c`, which was NOT committed. The tree then
      # could not configure on any machine except the one that had the file
      # untracked — two releases shipped that way. synstudio was not in this
      # list, so the guard that was written for exactly this walked past it.
      #
      # It costs nothing to widen: no toolchain, just git, and it answers for
      # components CI has no hope of compiling.
      - name: Every meson source is tracked
        run: |
          fail=0
          for c in $(ls -d */meson.build | cut -d/ -f1); do
            for f in $(grep -oE "src/[A-Za-z0-9_]+\.c" "$c/meson.build" | sort -u); do
              if ! git ls-files --error-unmatch "$c/$f" >/dev/null 2>&1; then
                echo "::error::$c/meson.build references untracked source $f"; fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ] && echo "ok: all meson sources tracked"
          exit $fail

      - name: build-all.sh keeps its anti-nesting guard
        run: |
          grep -q 're-ingests a previous extraction' build-all.sh \
            || { echo "::error::build-all.sh lost the tarball pre-clean guard"; exit 1; }
          echo "ok: anti-nesting guard present"

      # A check on a path NAME followed by an open of the same name. This is
      # the shape CodeQL flagged in synfiles' du (cpp/toctou-race-condition,
      # alert #13) — and code scanning only speaks after a push to main, on
      # code that has already shipped, so the same question is asked here where
      # it can still be answered in a branch. The scanner is pure awk: no
      # toolchain, which is why it belongs in this job.
      #
      # It asks the question in BOTH directions since alert #14: a name checked
      # and then opened, and a name OPENED and then chmod/chown/utime'd by name.
      # The second is what #14 was, in a test rig, and the scanner walked past
      # it while reporting the file clean.
      #
      # --self-test first, and it is not ceremony. A pattern-matcher that has
      # stopped matching passes every file and prints "ok", so the run that
      # proves nothing looks exactly like the run that proves everything. The
      # self-test plants four known bugs — including the initializer-brace shape
      # that the first version of this script scanned straight past — and fails
      # if any goes unreported. It also asserts that the two shapes this
      # scanner must NOT report stay unreported: two different string literals,
      # and an unlink() that has no descriptor form to move to.
      - name: No check-then-use on a path name (TOCTOU)
        run: |
          ./tools/check-toctou.sh --self-test
          ./tools/check-toctou.sh

      # The release bugs that keep coming back: a component in one build list
      # and not the others, a pkgver a scraper misreads, a KNOWN= name with no
      # build rule. Every one of them ships quietly and surfaces on velle's
      # machine as "syn-update keeps offering this" or "the menu row does
      # nothing", which is a long way from the line that caused it.
      #
      # Note what a CI checkout CANNOT answer: the pkgrel gate compares a
      # working tree against its base, and a fresh clone has no pending edits,
      # so that check passes trivially here. It is the local pre-commit run
      # (tools/pre-commit) that catches a missing bump. What runs here is the
      # at-rest half — the four lists agreeing, and every version field
      # resolving — which is exactly the half a clean checkout can prove.
      #
      # --self-test first, same reason as above: this script's list readers
      # return empty on a rename, and comparing two empty sets prints "ok" for
      # every check it has.
      - name: Component lists agree and every version resolves
        run: |
          ./tools/preflight.sh --self-test
          ./tools/preflight.sh

  # ── Real compile of every component on a current Arch toolchain ─
  build:
    runs-on: ubuntu-latest
    # Plain container: no --privileged, no device or module mounts. Those were
    # added to hand the smoke test a udmabuf DMA-BUF allocator so it could run on
    # llvmpipe, which turned out to be a dead end — mesa's software rasterizer
    # crashes inside its own JIT there (see tests/smoke.sh). The suite now skips
    # without a real DRM render node, so the runner needs nothing special.
    container: archlinux:latest
    steps:
      - name: Install toolchain and dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake meson ninja pkgconf \
            readline systemd-libs \
            wlroots0.20 wayland wayland-protocols libxkbcommon pixman cairo librsvg \
            linux-headers \
            wayland-utils foot kitty grim ttf-dejavu \
            ffmpeg fontconfig \
            mesa libglvnd \
            xorg-xwayland
        # xorg-xwayland: without it smoke test 13 (an X11 toplevel re-mapped 6
        # times leaks no frames) SKIPS rather than runs — the frame-leak guard
        # was silently not being enforced in CI at all.
        #
        # mesa/libglvnd are what make the smoke test possible at all: synui now
        # renders through scenefx's fx_renderer, which is GLES2-only, and a
        # runner has no /dev/dri — so the suite boots on mesa's llvmpipe
        # software device (see tests/smoke.sh). They arrive as wlroots deps
        # today; naming them here keeps that accident from becoming a red build.

      - uses: actions/checkout@v4

      - name: Cache llama.cpp staging
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: llama-staging
          key: llama-${{ env.LLAMA_REF }}-${{ runner.os }}

      - name: Build llama.cpp (CPU-only) → llama-staging
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --branch "$LLAMA_REF" \
            https://github.com/ggerganov/llama.cpp /tmp/llama
          # CI needs the LIBRARIES ONLY — synapd/meson.build looks for
          # libllama, libggml and libggml-base in llama-staging/usr/lib plus the
          # headers, and links nothing else. Every binary llama.cpp can build is
          # dead weight here, so the whole tools/ and app/ tree is off.
          #
          # Not merely a speed choice any more. At b10241 llama.cpp gained a
          # unified `llama` binary (app/, option LLAMA_BUILD_APP, default ON for
          # a standalone build) that links -lllama-cli-impl and
          # -lllama-server-impl unconditionally. Those impl libs live under
          # tools/ and are gated by LLAMA_BUILD_SERVER — so the old
          # `-DLLAMA_BUILD_SERVER=OFF` alone deleted the libraries while leaving
          # the target that links them, and the build died at 100% with
          # "cannot find -lllama-server-impl". Turning APP and TOOLS off removes
          # the dependency instead of just its target.
          #
          # LLAMA_BUILD_APP is the one that actually matters; TOOLS is off
          # because nothing here needs llama-bench/quantize/tts either, and
          # leaving it on is several minutes of CI per cache miss.
          cmake -S /tmp/llama -B /tmp/llama/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DGGML_NATIVE=OFF
          cmake --build /tmp/llama/build -j"$(nproc)"
          DESTDIR="$PWD/llama-staging" cmake --install /tmp/llama/build

      # scenefx is synui's glass dependency (corner radius / backdrop blur /
      # shadow) and is our own package, not in the Arch repos — so CI must build
      # and install it before synui, exactly as a real machine does from
      # SYNAPSE/scenefx0.5/. Without this, `meson setup synui` fails at
      # dependency('scenefx-0.5'). makepkg refuses to run as root, so build under
      # a throwaway user and then pacman -U the result. --nodeps: the build/make
      # deps (wlroots0.20, meson, ninja, wayland-protocols, pkgconf) are already
      # installed by the toolchain step above.
      #
      # scenefx0.5/, not scenefx/: the two are separate packages, versioned in
      # lockstep with wlroots (0.4.x = wlroots 0.19, 0.5.x = wlroots 0.20). synui
      # moved to 0.20 + 0.5, so building the 0.4 package here would install a
      # library synui no longer asks for — against a wlroots that is no longer
      # installed.
      - name: Build & install scenefx (synui glass dependency)
        run: |
          set -e
          useradd -m builder
          chown -R builder:builder scenefx0.5
          su builder -c 'cd scenefx0.5 && makepkg -f --noconfirm --nodeps --skipinteg'
          pacman -U --noconfirm scenefx0.5/scenefx0.5-0.5-*-x86_64.pkg.tar.zst

      # ffmpeg and fontconfig are synstudio's, and they are runtime deps
      # rather than build ones: the program links neither (a pipe has no ABI),
      # but its suite renders real video and resolves real font families, and
      # without them two thirds of it would SKIP while still printing a pass.
      - name: Build userspace components
        run: |
          set -e
          for c in synapd synsh synguard synnet synui; do
            echo "::group::build $c"
            meson setup "$c/_ci" "$c" --buildtype=release
            meson compile -C "$c/_ci"
            test -x "$c/_ci/$c"
            echo "::endgroup::"
          done
          echo "all userspace components built"

      # ⛔ AND ONCE MORE FROM THE TARBALL, WHICH IS A DIFFERENT TREE.
      #
      # Every step above configures the CHECKOUT. What actually ships is the
      # source tarball, and that is assembled from a hand-maintained list of
      # top-level directories — synui/mktarball.sh's contents=(), or the
      # allowlist in tools/collect-source.sh. A directory missing from the list
      # is simply absent from the tarball: the checkout still builds, this
      # workflow still passes, and the failure lands on the first machine that
      # starts from the tarball instead of from git.
      #
      # synui shipped exactly that way at 573. meson.build entered subdir('po'),
      # contents=() did not name po/, and the build died with "Nonexistent build
      # file 'po/meson.build'" — on a user's machine, after the commit had been
      # pushed and the release published, with this workflow green the whole
      # time. It is the same shape as the syn-kmod-status.c failure described
      # further down: green here, broken at makepkg, because the two are not
      # compiling the same set of files.
      #
      # preflight's check_subdir now catches that one class before the commit
      # exists. This catches the rest of it — a data file, a protocol xml, an
      # options file, anything the list forgot — by configuring the tarball the
      # way a real machine does.
      #
      # ⚠ CONFIGURE ONLY, DELIBERATELY. The compile is already covered above and
      # would only repeat it; what differs between the two trees is the FILE
      # LIST, and meson setup is what reads it. It costs seconds.
      - name: Configure each component from its source tarball
        run: |
          set -e

          # tools/collect-source.sh asks git what is source, and git refuses a
          # checkout it does not own — which is every checkout inside a
          # container. Without this it answers "nothing is tracked" and the
          # tarball comes out with no src/ at all.
          git config --global --add safe.directory "$PWD"

          # ⚠ EXTRACTED BESIDE llama-staging, NOT IN /tmp. synapd/meson.build
          # resolves libllama from the SIBLING directory ../llama-staging when
          # the system package is not installed, which is the case here — the
          # step above builds llama into the workspace rather than installing
          # it. Unpacked anywhere else the tarball configures against a sibling
          # that does not exist, and the failure looks like a packing bug when
          # it is only a relocated tree.
          rm -rf _tbcheck && mkdir -p _tbcheck
          # Relative on purpose: an absolute link would bake the runner's workspace
          # path into the tree, which is the thing the symlink check guards against.
          [ -d llama-staging ] && ln -s ../llama-staging _tbcheck/llama-staging

          for c in synapd synsh synguard synnet synui; do
            if [ -x "$c/mktarball.sh" ]; then
              ( cd "$c" && ./mktarball.sh >/dev/null )
              tb=$(ls "$c"/"$c"-*.tar.gz)
            else
              tb=$(tools/collect-source.sh "$c")
            fi
            tar xzf "$tb" -C _tbcheck
            d=$(echo _tbcheck/"$c"-*/)
            meson setup "$d/_tb" "$d" --buildtype=release >"/tmp/tb-$c.log" 2>&1 || {
              echo "::error::$c does not configure from its source tarball — a file its meson.build needs is not on the tarball's list"
              tail -40 "/tmp/tb-$c.log"
              exit 1
            }
            echo "$c configures from its tarball"
          done
          rm -rf _tbcheck

      # synstudio: the darkroom and edit suite. Its own component, built and
      # tested separately because it needs no wayland, no GPU and no daemon —
      # just a compiler and an ffmpeg on PATH — and because its suite is the
      # largest in the repo by a wide margin.
      #
      # ⚠ Until now it had never run anywhere but a developer machine. Five
      # hundred assertions covering the LUT bridge, the retime timebase, the
      # sound chain and the delivery path, and CI had no idea whether any of
      # it worked.
      - name: Build and test synstudio
        run: |
          set -e
          meson setup synstudio/_ci synstudio --buildtype=release
          meson compile -C synstudio/_ci
          test -x synstudio/_ci/synstudio
          bash synstudio/tests/run.sh synstudio/_ci/synstudio

      # And again under the sanitisers. Worth the second run on this one in
      # particular: it is the component that changed most in the last week,
      # every frame it measures goes through hand-written float buffers, and
      # the suite drives real ffmpeg subprocesses whose output it parses.
      #
      # UBSAN_OPTIONS matches meson's own injected default rather than
      # weakening it — see the note on the daemon sanitizer step above.
      - name: synstudio suite (ASan + UBSan)
        env:
          UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1:print_summary=1
        run: |
          set -e
          meson setup synstudio/_asan synstudio \
            -Dbuildtype=debug -Db_sanitize=address,undefined
          meson compile -C synstudio/_asan
          bash synstudio/tests/run.sh synstudio/_asan/synstudio

      # The installer's filesystem/bootloader decision table. syn-install cannot
      # be tested as a whole in CI — it partitions disks — but the table is a set
      # of pure functions, and a wrong entry there produces an install that
      # formats, reports success, and fails at first boot on someone else's
      # machine. Sourcing is safe: SYN_INSTALL_SOURCE_ONLY stops the script
      # before its root check and first prompt.
      - name: Installer layout table (filesystem × bootloader × encryption)
        run: |
          ./syn-install/tests/layout_test.sh

      # syn-update is how every installed machine gets a fix, so the thing worth
      # testing is what happens when it CANNOT — a cloning updater makes one
      # host the single point of failure for updating every box in existence.
      # The suite drives the fallback with local file:// repositories, so it
      # touches no network and does not care which host is eventually named.
      #
      # ⚠ 77 IS A SKIP, NOT A PASS AND NOT A FAILURE. The script exits 77 where
      # makepkg/pacman/vercmp are absent, and an unhandled 77 fails the step —
      # which would read as "the fallback is broken" on any runner that simply
      # is not Arch.
      #
      # ⚠ THE OTHER FOUR syn-update SUITES ARE STILL NOT RUN ANYWHERE. They
      # predate this and passing them was checked by hand; wiring them up is a
      # separate job from the one that added this line, and naming that here is
      # cheaper than rediscovering it.
      - name: syn-update source fallback (clone + fetch, and the state file)
        run: |
          ./syn-update/tests/mirror_failover_test.sh || rc=$?
          [ "${rc:-0}" = 0 ] || [ "${rc:-0}" = 77 ] || exit "$rc"

      # The language chosen at boot, and the two places it has to reach: the
      # SCREEN (a Linux VT cannot draw CJK, Arabic or Devanagari — 512 glyphs,
      # no shaper — so the text installer keeps English prose there) and the
      # SESSION (the live desktop is a systemd unit, so `export LANG` reaches
      # nothing and the whole session came up English). Both failed on the
      # 0.3.0 image; both are pure functions plus one stubbed call here.
      - name: Installer live-session language (console script + systemd env)
        run: |
          ./syn-install/tests/livelang_test.sh

      # The installer's thirteen catalogs, and the graphical installer's half of
      # them. Both halves fail in silence: a catalog whose English drifted from
      # the script prints the English forever, and the WINDOW has no catalog of
      # its own at all — it reads `syn-install --strings` through a pipe, so a
      # broken dump or a broken parse opens a window that looks exactly like a
      # language nobody has translated yet. The reader's own functions are cut
      # out of syn-install-gui.qml and run under Qt's qml, never quickshell.
      - name: Installer translations (catalogs + the GUI's string bridge)
        run: |
          ./syn-install/tests/i18n_test.sh
          ./syn-install/tools/gui-strings.py --check
          ./syn-install/tests/guilang_test.sh

      # syn-crypt aims LUKS operations at a block device. Resolving that wrongly
      # is not cosmetic — luksRemoveKey on the wrong device damages a disk, and
      # resolving to something that does not exist breaks every command that
      # takes no explicit DEVICE, which is how all of them are documented. Driven
      # against fake findmnt/lsblk, so it needs no root and no LUKS volume.
      - name: Installer disk-encryption tool (syn-crypt device resolution)
        run: |
          ./syn-install/tests/crypt_test.sh

      # The generated DaVinci Resolve desktop entry is what every menu launch of
      # Resolve goes through once it exists, and the two ways it can be wrong —
      # still running the raw binary, or losing the packaged entry's Name/Icon —
      # both look exactly like a working one. Needs no Resolve: it is a
      # transformation of a fixed file format, so the input is faked.
      - name: DaVinci Resolve launch override (syn resolve)
        run: |
          ./syn/tests/resolve_test.sh

      # syn-gfn's flags, which are the whole app: --class is what makes the
      # window dock-pinnable (synui resolves a pin by <app_id>.desktop and runs
      # the app_id as a command on a miss), --app= would silently take that
      # away, --start-fullscreen core-dumps Vivaldi under Wayland, and the
      # three site permissions have to be in the profile before a stream can
      # raise a prompt nobody can see. Stubs every candidate browser, so it
      # starts none.
      - name: GeForce NOW launcher (syn-gfn)
        run: |
          ./syn-gfn/tests/syn_gfn_test.sh

      # syn-remote is thin — wayvnc does the VNC — so what is tested is the part
      # a wrapper has to get right, and each has a silent failure behind it:
      # WHERE IT LISTENS (synnet's default-drop input chain accepts every
      # private-range source, so 0.0.0.0 means the whole LAN and nothing says
      # so), WHO CAN READ THE PASSWORD (the settings file is replaced through a
      # temporary on every change, so a chmod at creation does not survive), and
      # WAKING THE SCREEN (a blanked output cannot be captured at all, so
      # without it a viewer gets a black rectangle it cannot click out of).
      # Driven against stubs: no unit is enabled and no port is opened.
      - name: Remote desktop wrapper (syn-remote)
        run: |
          ./syn-remote/tests/syn_remote_test.sh

      # Whether MangoHud's Vulkan layer loads in EVERY client in the session.
      # It used to, which segfaulted the live wallpaper, synstudio and
      # synstudio's own test suite on AMD and nothing on NVIDIA — so the
      # default is off and the rule lives in three separate texts (the ISO's
      # profile.d and the installer's two session writers). This checks the
      # rule and that all three agree.
      - name: MangoHud session default (synui)
        run: |
          ./synui/tests/mangohud_session.sh

      # The firewall, and whether the box can find out it has one. synnet has
      # applied a default-drop input chain at every start for a while and
      # `--status` denied it anyway — listing an nftables object needs
      # CAP_NET_ADMIN, and any failure was read as "not there". Needs no root
      # here: the state half is a fixture, and the ruleset half reads back what
      # a stub `nft` was handed.
      - name: Firewall and its status (synnet)
        run: |
          meson test -C synnet/_ci firewall --print-errorlogs

      - name: Daemon unit tests (synapd wire gate, synguard verdict feed)
        run: |
          meson test -C synapd/_ci wire --print-errorlogs
          meson test -C synguard/_ci secfeed --print-errorlogs
          meson test -C synguard/_ci isolation --print-errorlogs
          meson test -C synguard/_ci policy --print-errorlogs

      # The step above proves these three get the right answer; this one proves
      # they do not corrupt memory getting there. All three are worth the second
      # run: synapd's wire gate is the code that reads every byte arriving on
      # /run/synapd/synapd.sock — which the TCP bridge fronts for another host —
      # secfeed is the verdict feed that once wedged at capacity through a slot
      # leak, and isolation is the stale-pid guard standing between a DENY
      # verdict and a SIGKILL'd bystander.
      #
      # Unlike the two synui smoke steps below, these need no GPU and so do NOT
      # skip here: each links exactly the one source it covers — no llama, no
      # sockets, no daemon, and isolation_test kills nothing. Until this step existed
      # the repo's only sanitizer coverage was those smoke tests, which exit 77
      # on every GPU-less runner, so in practice CI was compiling ASan builds
      # and running none of them.
      #
      # Only the test targets are built, not the daemons: a full synapd link
      # would drag libllama into an ASan build for no added coverage, since
      # nothing here calls it.
      #
      # UBSAN_OPTIONS is set deliberately, and the exact value matters.
      # UndefinedBehaviorSanitizer's own default is to print a diagnostic and
      # CARRY ON — the process still exits 0, so meson still reports a pass and
      # the step would be theatre. meson patches around that by injecting
      # halt_on_error/abort_on_error itself, but only when the variable is unset
      # (mesonbuild/mtest.py). That cuts both ways: setting a weaker value here
      # would suppress meson's stronger default rather than add to it. So this
      # matches meson's set and does not drop a flag from it. ASan aborts on
      # error without being asked; only UBSan needs telling.
      - name: Daemon unit tests (ASan + UBSan)
        env:
          UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1:print_summary=1
        run: |
          set -e
          meson setup synapd/_asan   synapd   -Dbuildtype=debug -Db_sanitize=address,undefined
          meson setup synguard/_asan synguard -Dbuildtype=debug -Db_sanitize=address,undefined
          meson compile -C synapd/_asan   wire_test
          meson compile -C synguard/_asan secfeed_test
          meson compile -C synguard/_asan isolation_test
          meson compile -C synguard/_asan policy_test
          meson test -C synapd/_asan   wire      --print-errorlogs
          meson test -C synguard/_asan secfeed   --print-errorlogs
          meson test -C synguard/_asan isolation --print-errorlogs
          meson test -C synguard/_asan policy    --print-errorlogs

      # Both smoke steps SKIP on a GPU-less runner (no /dev/dri/renderD*) and run
      # in full anywhere a real driver exists — a developer box, or a self-hosted
      # runner with a GPU, where they are worth wiring up. meson reports the skip
      # rather than a pass, so a green build here is not claiming they ran.
      # tests/smoke.sh carries the reasoning.
      - name: synui headless smoke test
        run: |
          meson test -C synui/_ci smoke --print-errorlogs

      # If this one ever dies with a bare "Segmentation fault (core dumped)"
      # again, run the ASan step FIRST: the release build's core is discarded by
      # the runner, while ASan prints a symbolized backtrace. That swap is what
      # identified both crashes here as mesa's, with no synui frame involved.
      - name: synui headless smoke test (ASan + LeakSanitizer)
        run: |
          meson setup synui/_asan synui -Dbuildtype=debug -Db_sanitize=address
          meson compile -C synui/_asan
          meson test -C synui/_asan smoke --print-errorlogs

      - name: Build kernel module
        run: |
          KDIR=$(ls -d /usr/lib/modules/*/build | head -1)
          echo "building synapse_kmod against $KDIR"
          make -C synapse_kmod KERNELDIR="$KDIR"
          test -f synapse_kmod/synapse_kmod.ko
          echo "synapse_kmod.ko built"

          # Ask the built module what it needs from the kernel. This runner's
          # kernel is ahead of any development box, and that is how the
          # strncpy() removal in 7.2 was found: an error here, a clean build
          # there. check-symbols answers on ANY kernel, so the next removal is
          # caught before it reaches this step.
          make -C synapse_kmod KERNELDIR="$KDIR" check-symbols \
              || { echo "::error::synapse_kmod references a removed kernel API"; exit 1; }

          # The package builds a userspace tool against the same headers, and
          # this step used to stop at the .ko — so a commit could delete
          # something from include/synapse_kmod.h, pass CI green, and only fail
          # at makepkg on a real machine. That is exactly what happened when
          # the AI_CTX family was removed: the module built fine, and
          # syn-kmod-status.c still referenced NR_AI_CTX_SET and
          # struct ai_ctx_set_args. Compile it the way the PKGBUILD does.
          gcc -Isynapse_kmod/include -Wall -Wextra \
              -o /tmp/syn-kmod-status synapse_kmod/tools/syn-kmod-status.c \
              || { echo "::error::syn-kmod-status.c does not build against include/"; exit 1; }
          echo "syn-kmod-status built"
