name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: both jobs only ever check the repo out and
# compile it. Without this the token inherits the repository default, which can
# be write-all — a compromised action or dependency could then push to main.
# Any future job that needs more (releases, packages) must opt in explicitly.
permissions:
  contents: read

# Pinned llama.cpp build tag. Local llama-staging is build 8274
# (libllama.so.0.0.8274), but upstream never tagged b8273–b8275, so we
# pin the nearest tag at or below it. Bump this to move synapd to a
# newer llama.cpp; the cache key follows it automatically.
env:
  LLAMA_REF: b8272

jobs:
  # ── Fast structural guards (no toolchain) ──────────────────
  # Catches the regressions the repo just recovered from: tracked build
  # artifacts, absolute/dangling symlinks, and meson sources that were
  # never committed.
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No tracked build artifacts
        run: |
          hits=$(git ls-files \
            | grep -E '\.(pkg\.tar\.zst|o|ko|cmd|symvers)$|(^|/)pkg/|/src/[A-Za-z0-9_]+-0\.1\.0/|^llama-staging/|^archiso/build/' \
            || true)
          if [ -n "$hits" ]; then
            echo "::error::tracked build artifacts must not be committed:"; echo "$hits"; exit 1
          fi
          echo "ok: no tracked build artifacts"

      - name: No symlinks leaking a local checkout path
        run: |
          # Guards the regression we fixed: makepkg-dropped symlinks pointing
          # at an absolute developer path (/home/.../SYNAPSE). Legitimate
          # systemd .wants/ symlinks into /usr and /etc are fine.
          fail=0
          while IFS= read -r l; do
            [ -z "$l" ] && continue
            tgt=$(readlink "$l")
            case "$tgt" in
              /home/*|/Users/*|/root/*|*/SYNAPSE/*|*/GitHub/*)
                echo "::error::symlink leaks a local checkout path: $l -> $tgt"; fail=1 ;;
            esac
          done < <(git ls-files -s | awk '$1=="120000"{ $1=$2=$3=""; sub(/^   /,""); print }')
          [ "$fail" -eq 0 ] && echo "ok: no checkout-path symlinks"
          exit $fail

      - name: Every meson source is tracked
        run: |
          fail=0
          for c in synapd synsh synguard synnet synui; do
            for f in $(grep -oE "src/[A-Za-z0-9_]+\.c" "$c/meson.build" | sort -u); do
              if ! git ls-files --error-unmatch "$c/$f" >/dev/null 2>&1; then
                echo "::error::$c/meson.build references untracked source $f"; fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ] && echo "ok: all meson sources tracked"
          exit $fail

      - name: build-all.sh keeps its anti-nesting guard
        run: |
          grep -q 're-ingests a previous extraction' build-all.sh \
            || { echo "::error::build-all.sh lost the tarball pre-clean guard"; exit 1; }
          echo "ok: anti-nesting guard present"

  # ── Real compile of every component on a current Arch toolchain ─
  build:
    runs-on: ubuntu-latest
    # Plain container: no --privileged, no device or module mounts. Those were
    # added to hand the smoke test a udmabuf DMA-BUF allocator so it could run on
    # llvmpipe, which turned out to be a dead end — mesa's software rasterizer
    # crashes inside its own JIT there (see tests/smoke.sh). The suite now skips
    # without a real DRM render node, so the runner needs nothing special.
    container: archlinux:latest
    steps:
      - name: Install toolchain and dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake meson ninja pkgconf \
            readline systemd-libs \
            wlroots0.20 wayland wayland-protocols libxkbcommon pixman cairo librsvg \
            linux-headers \
            wayland-utils foot grim ttf-dejavu \
            mesa libglvnd \
            xorg-xwayland
        # xorg-xwayland: without it smoke test 13 (an X11 toplevel re-mapped 6
        # times leaks no frames) SKIPS rather than runs — the frame-leak guard
        # was silently not being enforced in CI at all.
        #
        # mesa/libglvnd are what make the smoke test possible at all: synui now
        # renders through scenefx's fx_renderer, which is GLES2-only, and a
        # runner has no /dev/dri — so the suite boots on mesa's llvmpipe
        # software device (see tests/smoke.sh). They arrive as wlroots deps
        # today; naming them here keeps that accident from becoming a red build.

      - uses: actions/checkout@v4

      - name: Cache llama.cpp staging
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: llama-staging
          key: llama-${{ env.LLAMA_REF }}-${{ runner.os }}

      - name: Build llama.cpp (CPU-only) → llama-staging
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --branch "$LLAMA_REF" \
            https://github.com/ggerganov/llama.cpp /tmp/llama
          cmake -S /tmp/llama -B /tmp/llama/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DGGML_NATIVE=OFF
          cmake --build /tmp/llama/build -j"$(nproc)"
          DESTDIR="$PWD/llama-staging" cmake --install /tmp/llama/build

      # scenefx is synui's glass dependency (corner radius / backdrop blur /
      # shadow) and is our own package, not in the Arch repos — so CI must build
      # and install it before synui, exactly as a real machine does from
      # SYNAPSE/scenefx0.5/. Without this, `meson setup synui` fails at
      # dependency('scenefx-0.5'). makepkg refuses to run as root, so build under
      # a throwaway user and then pacman -U the result. --nodeps: the build/make
      # deps (wlroots0.20, meson, ninja, wayland-protocols, pkgconf) are already
      # installed by the toolchain step above.
      #
      # scenefx0.5/, not scenefx/: the two are separate packages, versioned in
      # lockstep with wlroots (0.4.x = wlroots 0.19, 0.5.x = wlroots 0.20). synui
      # moved to 0.20 + 0.5, so building the 0.4 package here would install a
      # library synui no longer asks for — against a wlroots that is no longer
      # installed.
      - name: Build & install scenefx (synui glass dependency)
        run: |
          set -e
          useradd -m builder
          chown -R builder:builder scenefx0.5
          su builder -c 'cd scenefx0.5 && makepkg -f --noconfirm --nodeps --skipinteg'
          pacman -U --noconfirm scenefx0.5/scenefx0.5-0.5-*-x86_64.pkg.tar.zst

      - name: Build userspace components
        run: |
          set -e
          for c in synapd synsh synguard synnet synui; do
            echo "::group::build $c"
            meson setup "$c/_ci" "$c" --buildtype=release
            meson compile -C "$c/_ci"
            test -x "$c/_ci/$c"
            echo "::endgroup::"
          done
          echo "all userspace components built"

      - name: Daemon unit tests (synapd wire gate, synguard verdict feed)
        run: |
          meson test -C synapd/_ci wire --print-errorlogs
          meson test -C synguard/_ci secfeed --print-errorlogs

      # Both smoke steps SKIP on a GPU-less runner (no /dev/dri/renderD*) and run
      # in full anywhere a real driver exists — a developer box, or a self-hosted
      # runner with a GPU, where they are worth wiring up. meson reports the skip
      # rather than a pass, so a green build here is not claiming they ran.
      # tests/smoke.sh carries the reasoning.
      - name: synui headless smoke test
        run: |
          meson test -C synui/_ci smoke --print-errorlogs

      # If this one ever dies with a bare "Segmentation fault (core dumped)"
      # again, run the ASan step FIRST: the release build's core is discarded by
      # the runner, while ASan prints a symbolized backtrace. That swap is what
      # identified both crashes here as mesa's, with no synui frame involved.
      - name: synui headless smoke test (ASan + LeakSanitizer)
        run: |
          meson setup synui/_asan synui -Dbuildtype=debug -Db_sanitize=address
          meson compile -C synui/_asan
          meson test -C synui/_asan smoke --print-errorlogs

      - name: Build kernel module
        run: |
          KDIR=$(ls -d /usr/lib/modules/*/build | head -1)
          echo "building synapse_kmod against $KDIR"
          make -C synapse_kmod KERNELDIR="$KDIR"
          test -f synapse_kmod/synapse_kmod.ko
          echo "synapse_kmod.ko built"
