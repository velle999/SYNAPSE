# CodeQL, built rather than guessed — and seven queries that never finish.
#
# GitHub's DEFAULT setup was cancelled at the six-hour job ceiling on every
# push to main. It was never slow at extraction: it got through 54 of its 61
# C/C++ queries in about a hundred seconds, then the rest ran until the job
# was killed.
#
# The obvious suspect was the database. Default setup extracts C/C++ with
# `--build-mode: none`, which reads source files without ever running a
# compiler, so types, macros and include paths are guesses — and the queries
# that hung were all range analysis, the family least able to work on guesses.
#
# ⚠ THAT WAS THE WRONG SUSPECT, and this file records the measurement rather
# than the theory. Building the code and tracing the compiler produced a much
# better database and the same seven queries still did not finish — 30 minutes
# on a traced database against a slowest-healthy-query time of 25.9 SECONDS.
# So they are excluded by id in .github/codeql-config.yml, with the evidence,
# and the build below stays because a traced database is worth having on its
# own merits and because it is what proved the extraction was innocent.
#
# The seven: cpp/uncontrolled-arithmetic, cpp/comparison-with-wider-type,
# cpp/static-buffer-overflow, cpp/signed-overflow-check,
# cpp/overflowing-snprintf, cpp/unsigned-difference-expression-compared-zero,
# cpp/very-likely-overrunning-write.
#
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, which is what default setup was doing. A scheduled run catches
    # a new query finding an old bug — the alerts that matter most here have
    # all been in code that had not changed.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # ⚠ Not optional, and it has already earned its place: it is what turned
    # a six-hour cancellation into a thirty-minute one with a log worth
    # reading, which is how the seven queries above were identified. A healthy
    # run finishes every query in under a minute, so if this ever trips again
    # it is a regression to look at and not a limit to raise.
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@v4

      # Only for the language that is actually compiled. The other two are
      # read directly and were never the problem — both finished in under a
      # minute under default setup.
      - name: Install the C toolchain
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Seven C/C++ queries that do not terminate on this codebase —
          # measured twice, on a buildless database and on a traced one, and
          # the reasoning is in the file. The traced build below is still the
          # right thing to do: it is a more accurate database, and it is what
          # PROVED extraction quality was not the cause.
          config-file: .github/codeql-config.yml

      # What can be built on a stock runner, which is more of this repo than
      # it looks: five components declare no external dependency at all and
      # link nothing but libc and libm — about forty thousand lines of C, and
      # the part of the tree that changes most often.
      #
      # Deliberately NOT here: synui (wlroots 0.20 + scenefx), synpkg
      # (libalpm), syntty (freetype, fontconfig, wayland), syn-arcade (SDL3),
      # synapd (llama.cpp), and synapse_kmod (kernel headers). Every one of
      # those needs the Arch container that build.yml already stands up, and
      # bringing that container in here is a second problem to solve — worth
      # doing once this is proven green, not in the same change.
      #
      # ⚠ A component that fails to build is a component silently MISSING from
      # the database, and the analysis would still pass. `set -e` plus the
      # explicit binary test is what turns that into a red build instead.
      - name: Build the C that needs no external libraries
        if: matrix.language == 'c-cpp'
        run: |
          set -e
          for c in synstudio synfiles syn-settings syn-edit syn-disks; do
            echo "::group::build $c"
            meson setup "$c/_codeql" "$c" --buildtype=debug
            meson compile -C "$c/_codeql"
            echo "::endgroup::"
          done
          echo "built: synstudio synfiles syn-settings syn-edit syn-disks"

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
