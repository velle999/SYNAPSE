<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- The SynapseOS dendrite mark, transparent variant, for the header of big
       screen mode. Same drawing as synui/data/logo.svg and
       /usr/share/synapseos/logo.svg — keep the three in step.

       ⚠ It is here rather than read from /usr/share/synui/logo.svg because
       big screen mode must draw on a machine where synui is an optdepend, and
       a header whose emblem is missing on some installs is worse than one
       that never had it. It resolves through icon_file() like every tile
       glyph, so the source tree and the installed tree both work. -->
  <g transform="translate(512,512)">
    <!-- faint triangle containment -->
    <polygon points="0,-464 400,272 -400,272" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.4"/>

    <!-- central node -->
    <circle cx="0" cy="-48" r="36" fill="#a78bfa"/>

    <!-- three primary branches -->
    <line x1="0" y1="-48" x2="0" y2="-416" stroke="#a78bfa" stroke-width="8"/>
    <line x1="0" y1="-48" x2="288" y2="192" stroke="#a78bfa" stroke-width="8"/>
    <line x1="0" y1="-48" x2="-288" y2="192" stroke="#a78bfa" stroke-width="8"/>

    <!-- two inner branches, straight and angled wider away from the primaries -->
    <line x1="0" y1="-48" x2="176" y2="200" stroke="#a78bfa" stroke-width="4.4"/>
    <line x1="0" y1="-48" x2="-176" y2="200" stroke="#a78bfa" stroke-width="4.4"/>

    <!-- primary terminal nodes -->
    <circle cx="0" cy="-416" r="17.6" fill="#a78bfa"/>
    <circle cx="288" cy="192" r="17.6" fill="#a78bfa"/>
    <circle cx="-288" cy="192" r="17.6" fill="#a78bfa"/>

    <!-- inner branch terminal nodes -->
    <circle cx="176" cy="200" r="12.8" fill="#a78bfa"/>
    <circle cx="-176" cy="200" r="12.8" fill="#a78bfa"/>
  </g>
</svg>
