# The queue the control panel's model downloader talks through.
#
# root:synapse 0770 — synui runs as the user and has to be able to drop a
# request file and read the progress back; only root (the unit) ever writes a
# model. Group-writable is the whole privilege boundary, which is why
# `syn-model fetch` treats everything in req/ as untrusted input.
d /run/syn-model     0770 root synapse -
d /run/syn-model/req 0770 root synapse -
