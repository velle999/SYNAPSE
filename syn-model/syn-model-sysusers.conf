# The group /run/syn-model and /run/syn-model/req are owned by -- see
# syn-model-tmpfiles.conf, which is the privilege boundary the downloader runs
# on: synui (as the user, in this group) drops a request, only root writes a
# model.
#
# Declared here as well as in synapd, and deliberately so. Both are idempotent
# to systemd-sysusers, and syn-model does not depend on synapd -- a package
# whose tmpfiles names a group has to be the package that guarantees it, or the
# guarantee is somebody else's install order. See synapd/sysusers/synapd.conf
# for the failure this prevents.
g synapse -
