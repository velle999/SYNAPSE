# /usr/lib/systemd/system/clamav-daemon.service.d/50-synapse-hardening.conf
#
# Sandbox ClamAV's stock scanning daemon. Added 2026-09-10 after a Lynis 3.1.7
# audit: BOOT-5264 scored clamav-daemon.service 9.6 UNSAFE, tied for the worst
# unit on the system. Arch's unit has an ExecStart, an ExecReload and a
# timeout, with no hardening at all.
#
# ⚠ clamd IS OPT-IN ON SynapseOS and this drop-in only matters on a machine
# that turned it on. It ships anyway: we are the reason ClamAV is installed at
# all, so its posture is ours whether or not the daemon is running today.
#
# ⛔ AND IT IS NOT A COPY OF THE freshclam DROP-IN, though it started as one.
# freshclam talks to the network and writes a database. clamd READS OTHER
# PEOPLE'S FILES for a living, which reverses two of the directives below.
#
# WHY THIS LIVES IN syn-scan
#
# ClamAV is not enabled on SynapseOS by anything else; syn-scan's install
# scriptlet is what turns freshclam on, so its posture is ours to set. Shipping
# the drop-in from this package means pacman tracks it, it survives a reinstall
# and it reaches the ISO — none of which is true of a hand-placed file in
# /etc/systemd/system/. A drop-in rather than a patched unit, so a clamav
# upgrade cannot silently revert it. A user override still wins: /etc is read
# after /usr/lib.

[Service]

# clamd starts as root and drops to the User from clamd.conf itself, so
# NoNewPrivileges is safe here — it blocks GAINING privilege through a setuid
# binary, not a root process calling setresuid on itself. The capabilities that
# drop needs are kept in the bounding set below.
NoNewPrivileges=true

# ── Filesystem ──────────────────────────────────────────────────────────────
#
# strict, with the two paths it writes named. Taken from clamd.conf rather than
# assumed: LogFile (/var/log/clamav/clamd.log) and PidFile
# (/run/clamav/clamd.pid). The signature database it only reads.
ProtectSystem=strict
ReadWritePaths=/var/log/clamav /run/clamav

# ⛔ read-only, NOT true. A scanner that cannot see /home cannot scan anybody's
# files, and it would fail by finding nothing rather than by refusing — the
# worst way for an antivirus to break. Read-only is all it needs: it opens
# files to hash them and never writes one.
ProtectHome=read-only

# ⚠ clamd extracts archives into a temporary directory, so a private one is
# right. It does mean a client that hands clamd a PATH under the real /tmp gets
# a "file not found" — syn-scan always passes the descriptor instead
# (clamdscan --fdpass), which is required anyway for clamd to read a file in
# somebody's home.
PrivateTmp=true

# It reads regular files and answers on a UNIX socket. No device node is
# involved in either.
PrivateDevices=true

# ── Kernel-facing ───────────────────────────────────────────────────────────
ProtectClock=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectHostname=true
ProtectProc=invisible

# ── Process ─────────────────────────────────────────────────────────────────
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native

# ⚠ LocalSocket ONLY, which is Arch's shipped clamd.conf. Anybody who
# uncomments TCPSocket to expose the daemon on a port has to add AF_INET here
# in an /etc override — and should read RestrictAddressFamilies twice before
# putting a scanning daemon on a network socket.
RestrictAddressFamilies=AF_UNIX AF_NETLINK

# Enough to drop to the clamav user and to read files whose permissions would
# otherwise refuse it — which is what a scanner asked to check somebody else's
# download needs.
# ⚠ THIS IS THE HIGHEST-RISK LINE IN THE FILE. If clamd ever fails to start
# after a ClamAV upgrade, comment this out FIRST and re-measure before
# suspecting anything above it.
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER

# The log records every path this daemon was asked about.
UMask=0027

# ── Deliberately NOT set ────────────────────────────────────────────────────
#
#   PrivateNetwork=true
#       Would be correct for a LocalSocket-only daemon and is left off anyway,
#       because uncommenting TCPSocket in clamd.conf is a supported thing to do
#       and this would break it in a way whose error message names systemd
#       rather than the setting the admin just changed.
#
#   SystemCallFilter=~@privileged
#       clamd drops privileges itself, and setuid/setgid live in @privileged.
#       Filtering that set would break the drop.
#
#   ⛔ MemoryDenyWriteExecute=true
#       NOT AN OVERSIGHT. ClamAV's bytecode engine JITs signatures — that is
#       what bytecode.cvd is — and a JIT needs to write a page and then execute
#       it. This would break scanning for exactly the signature class written
#       to catch the newest things, and it would break it quietly.
