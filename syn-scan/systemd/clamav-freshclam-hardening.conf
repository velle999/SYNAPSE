# /usr/lib/systemd/system/clamav-freshclam.service.d/50-synapse-hardening.conf
#
# Sandbox ClamAV's stock signature updater. Added 2026-09-10 after a Lynis
# 3.1.7 audit: BOOT-5264 scored clamav-freshclam.service 9.6 UNSAFE, tied for
# the worst unit on the system. Arch's unit is four lines — a Description, a
# network dependency and an ExecStart — with no hardening at all.
#
# WHY THIS LIVES IN syn-scan
#
# ClamAV is not enabled on SynapseOS by anything else; syn-scan's install
# scriptlet is what turns freshclam on, so its posture is ours to set. Shipping
# the drop-in from this package means pacman tracks it, it survives a reinstall
# and it reaches the ISO — none of which is true of a hand-placed file in
# /etc/systemd/system/. A drop-in rather than a patched unit, so a clamav
# upgrade cannot silently revert it. A user override still wins: /etc is read
# after /usr/lib.

[Service]

# freshclam starts as root and drops to the DatabaseOwner from freshclam.conf
# itself, so NoNewPrivileges is safe here — it blocks GAINING privilege through
# a setuid binary, not a root process calling setresuid on itself. The
# capabilities that drop needs are kept in the bounding set below.
NoNewPrivileges=true

# ── Filesystem ──────────────────────────────────────────────────────────────
#
# strict rather than full, with the three paths it actually writes named. Taken
# from freshclam.conf rather than assumed: DatabaseDirectory (/var/lib/clamav),
# UpdateLogFile (/var/log/clamav/freshclam.log) and PidFile
# (/run/clamav/freshclam.pid).
ProtectSystem=strict
ReadWritePaths=/var/lib/clamav /var/log/clamav /run/clamav
ProtectHome=true
PrivateTmp=true

# A minimal /dev still has urandom in it, which is what the TLS handshake to
# the mirror needs.
PrivateDevices=true

# ── Kernel-facing ───────────────────────────────────────────────────────────
ProtectClock=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectHostname=true
ProtectProc=invisible

# ── Process ─────────────────────────────────────────────────────────────────
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native

# It downloads over HTTPS and resolves names, so the inet families stay.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK

# Enough to drop to the clamav user and own the files it writes, and no more.
# ⚠ THIS IS THE HIGHEST-RISK LINE IN THE FILE. If freshclam ever fails to start
# after a ClamAV upgrade, comment this out FIRST and re-measure before
# suspecting anything above it.
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER

# The signature database is not a secret, but the log records what this machine
# fetched and when.
UMask=0027

# ── Deliberately NOT set ────────────────────────────────────────────────────
#
#   PrivateNetwork=true
#       The entire job is downloading signatures. This is the single directive
#       that costs the most score here and it is simply not available.
#
#   SystemCallFilter=~@privileged
#       freshclam drops privileges itself, and setuid/setgid live in
#       @privileged. Filtering that set would break the drop — and it would
#       break it at the moment of the first update, not at boot.
#
#   MemoryDenyWriteExecute=true
#       Untested against ClamAV's bytecode engine, which JITs. freshclam itself
#       has no obvious need to write-then-execute, but bytecode.cvd is what it
#       fetches and verifies, and the risk/reward is poor for a process that is
#       unprivileged within a second of starting.
