# /etc/rkhunter.d/50-synapse.conf — what rkhunter reports on every SynapseOS
# machine that is not a finding. Shipped by syn-scan.
#
# rkhunter reads every *.conf in /etc/rkhunter.d after /etc/rkhunter.conf; for
# a single-valued option the last one read wins. This file is replaced on
# upgrade, so a local change belongs in a file of its own beside it.
#
# ⛔ ONLY WHAT A STOCK ARCH SYSTEM TRIPS. Each whitelist entry below was
# reported by the weekly sweep on 2026-09-22 and traced to the package that
# ships it. Anything machine-specific stays out: a whitelist entry is a check
# that never fires again, on every SynapseOS machine. The last option is not a
# whitelist; it says why at the end.

# Shell scripts in Arch's own packages: egrep and fgrep are grep's wrappers
# (grep), ldd is a bash script (glibc).
SCRIPTWHITELIST=/usr/bin/egrep
SCRIPTWHITELIST=/usr/bin/fgrep
SCRIPTWHITELIST=/usr/bin/ldd

# systemd's ConditionNeedsUpdate= stamp, and two krb5 man pages whose names
# begin with a dot.
ALLOWHIDDENFILE=/etc/.updated
ALLOWHIDDENFILE=/usr/share/man/man5/.k5identity.5.gz
ALLOWHIDDENFILE=/usr/share/man/man5/.k5login.5.gz

# SSH. rkhunter reads /etc/ssh/sshd_config alone — it does not follow Include,
# so a setting in /etc/ssh/sshd_config.d/ is invisible to it.
#
# PermitRootLogin: with no value in sshd_config rkhunter warns that the default
# "may be 'yes'". OpenSSH's default has been prohibit-password since 7.0.
# 'unset' accepts the default, and a PermitRootLogin line in sshd_config itself
# is still compared against this — set this to the same value if you add one.
ALLOW_SSH_ROOT_USER=unset
#
# Protocol: OpenSSH removed protocol 1 in 7.6 and ignores this option. 2 stops
# rkhunter warning that it is unset.
ALLOW_SSH_PROT_V1=2

# The O/S name or host name differing from the baseline's. rkhunter warns so
# that a batch of changed files after an OS upgrade has an explanation, and asks
# for a full --propupd. On SynapseOS the baseline is kept per file by syn-scan's
# pacman hook, so an OS change explains nothing, and every release would
# otherwise add two warnings to each weekly sweep until somebody re-ran it.
WARN_ON_OS_CHANGE=0
