# Pull the fingerprint sync in whenever greetd starts.
#
# ⛔ A DROP-IN RATHER THAN AN [Install] SYMLINK, so nothing has to be enabled.
# synui cannot run `systemctl enable` from a package scriptlet on a machine that
# is not booted, and an opt-in that also needed a second command to arm it is
# the same bug this whole file exists to fix.
[Unit]
Wants=synui-login-fprint.service
After=synui-login-fprint.service
