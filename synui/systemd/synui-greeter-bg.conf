# synui — where a session publishes the background its LOCK screen shows, so
# the LOGIN screen can show the same one.
#
# ⛔ THE GREETER CANNOT READ THE USER'S ANYTHING. greetd runs `synui --greeter`
# as the unprivileged `greeter` account, and a home directory is 0700 — so
# neither the user's synuirc nor a wallpaper living under it (the default IS
# ~/.config/synui/wallpaper.png) can be read at the login screen. The session
# copies the resolved answer here instead.
#
# ⚠ STICKY, LIKE /tmp, AND THAT IS THE POINT. A session writes this with no
# privilege and no authentication prompt: a background that needed authorising
# would be a background nobody kept in step, and the setting would go back to
# being two settings. Sticky means one user cannot remove or replace another's
# subdirectory, and `synui --greeter` checks that the directory it reads is
# owned by the account it is about to log in before it decodes anything.
d /var/lib/synui          0755 root root -
d /var/lib/synui/greeter  1777 root root -
