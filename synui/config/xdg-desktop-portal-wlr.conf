# xdg-desktop-portal-wlr defaults for synui.
#
# When an app asks to share "the screen", xdpw has to know *which* output — and
# on a multi-head box (which this one is) it cannot guess. Without a chooser it
# either fails or silently grabs the wrong monitor, so point it at slurp, which
# lets the user click the output they mean.
#
# max_fps caps the capture rate: screencopy re-reads the framebuffer every
# frame, so an uncapped 165 Hz share would burn far more GPU on the capture
# than on the thing being captured.

[screencast]
chooser_type=simple
chooser_cmd=slurp -f %o -or
max_fps=30
