    # ── SynapseOS quirks ─────────────────────────────────────────────────────
    # Injected at the TOP of bluez5.features.device by synui-bluez-quirks(1),
    # because that list is first-match-wins.
    #
    # Every entry here is a device that announces max AVRCP absolute volume the
    # moment the A2DP transport comes up, overwriting whatever volume
    # WirePlumber just restored from default-routes — i.e. 100% straight into
    # your ears on every connect. `no-features = [ hw-volume ]` is upstream's
    # own fix for that symptom; the packaged database already carries it for a
    # dozen units (see the "doesn't remember volume" comments below), and these
    # are the ones it does not carry yet.
    #
    # The trade-off, per device listed: PipeWire attenuates in software, and the
    # headset's own volume buttons stop driving system volume. That is the
    # correct trade for hardware that cannot be trusted with the volume.
    #
    # Matched on name, not address — a MAC identifies one person's headset, and
    # this file ships to everyone. The `~` prefix makes it a regex, which is how
    # the casing gets covered ("P20i" is engraved on the case; BlueZ has been
    # seen advertising "p20i").
    #
    # When PipeWire ships one of these upstream, DELETE it here. A duplicate is
    # harmless (ours simply matches first, to the same effect) but it hides the
    # fact that the quirk is now maintained by someone else.
    { name = "~.*[Pp]20[iI].*", no-features = [ hw-volume ] },  # soundcore P20i
