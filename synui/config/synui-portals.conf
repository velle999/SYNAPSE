# xdg-desktop-portal backend routing for the synui desktop.
#
# xdg-desktop-portal picks this file by matching its name against
# XDG_CURRENT_DESKTOP (set to "synui" by the session — synui-session,
# syn-install's .bash_profile block, and the ISO's profile.d). Without both the
# variable and this file, portal falls back to the GTK backend for everything
# and logs "Choosing gtk.portal ... as a last-resort fallback".
#
# That fallback is why screen sharing did not work: the GTK backend cannot do
# ScreenCast on a wlroots compositor. xdg-desktop-portal-wlr can, and it drives
# it through zwlr_screencopy / zwlr_export_dmabuf — both of which synui already
# advertises.
#
# Everything else (file chooser, settings, print) stays on GTK, which is what
# it is good at.

[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
