# Point the bluez5 SPA plugin at SynapseOS's copy of the hardware-quirk
# database, so the entries in /usr/share/synui/bluez5-quirks.conf take effect.
# Those entries stop headsets that announce max AVRCP absolute volume from
# blasting 100% into your ears every time they connect.
#
# EnvironmentFile with a leading `-`, not a plain Environment=SPA_DATA_DIR, on
# purpose. SPA_DATA_DIR redirects the WHOLE quirk-database lookup, so setting it
# unconditionally would take away every quirk PipeWire ships whenever our copy
# is not there — during the window between installing synui and the pacman hook
# running, or after any failure in synui-bluez-quirks. That script writes this
# env file last and deletes it on any error, so an absent file means "fall back
# to the packaged database", and `-` makes that a non-error rather than a
# service that refuses to start.
#
# See synui-bluez-quirks(1) — /usr/bin/synui-bluez-quirks — for why the database
# is shadowed at all, and for the two fixes that look like they should work here
# and do not.

[Service]
EnvironmentFile=-/usr/share/synui/spa-0.2/env
