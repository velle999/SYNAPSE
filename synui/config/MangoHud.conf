# SynapseOS system-wide MangoHud defaults (/etc/MangoHud.conf).
#
# The session exports MANGOHUD=1 (synui-session, synapseos.sh), which enables
# MangoHud's Vulkan implicit layer for every Vulkan client — Steam, Lutris,
# RetroArch, bare binaries, Proton/DXVK/VKD3D — with no launcher wrapper. That
# is deliberate: a wrapper only ever covers the one launch path it wraps.
#
# So the layer is loaded in every game, but the overlay is HIDDEN until asked
# for (no_display). Shift_R+F12 toggles it live inside the running game, which
# is the only place such a toggle can work — nothing can inject an overlay into
# a process that is already up, so this cannot be a compositor keybind.
#
# A per-user ~/.config/MangoHud/MangoHud.conf overrides this file entirely.

# Hidden until toggled. Remove this line to have the hud up from launch.
no_display
toggle_hud=Shift_R+F12

legacy_layout=false
fps
frametime=1
frame_timing=1
gpu_stats
gpu_temp
gpu_load_change
cpu_stats
cpu_temp
cpu_load_change
ram
vram
position=top-left
font_size=20
background_alpha=0.4
