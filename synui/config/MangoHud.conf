# SynapseOS system-wide MangoHud defaults (/etc/MangoHud.conf).
#
# ⚠ THIS FILE IS THE LOOK, NOT THE SWITCH. Whether MangoHud loads at all is
# /etc/synapseos/mangohud.conf's business: the session no longer exports
# MANGOHUD=1 for every process (that loaded the Vulkan layer into every client
# in the session and segfaulted three non-games on AMD), so the layer arrives
# with the launcher instead — `syn game steam`, `syn game -- ./game`,
# synui-game-run — and everything they start inherits it.
#
# Wherever it does load, the overlay is HIDDEN until asked for (no_display). Shift_R+F12 toggles it live inside the running game, which
# is the only place such a toggle can work — nothing can inject an overlay into
# a process that is already up, so this cannot be a compositor keybind.
#
# A per-user ~/.config/MangoHud/MangoHud.conf overrides this file entirely.

# Hidden until toggled. Remove this line to have the hud up from launch.
no_display
toggle_hud=Shift_R+F12

legacy_layout=false
fps
frametime=1
frame_timing=1
gpu_stats
gpu_temp
gpu_load_change
cpu_stats
cpu_temp
cpu_load_change
ram
vram
position=top-left
font_size=20
background_alpha=0.4
