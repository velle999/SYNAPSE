# SynapseOS: should MangoHud's overlay layer load in EVERYTHING?
# (/etc/synapseos/mangohud.conf — the session reads this at login.)
#
# MangoHud's Vulkan manifest declares
#
#     "enable_environment":  { "MANGOHUD": "1" }
#     "disable_environment": { "DISABLE_MANGOHUD": "1" }
#
# so exporting MANGOHUD=1 for the session is ONE VARIABLE THAT LOADS
# VK_LAYER_MANGOHUD_overlay INTO EVERY VULKAN CLIENT IN IT — a game, a browser,
# a video player, a QML app that touched QtMultimedia, a test.
#
# ⛔ THAT WAS THE DEFAULT HERE AND IT COST THREE PROGRAMS. On AMD (Renoir) the
# layer segfaults the client inside its own vkCreateDevice hook, and on NVIDIA
# it never does:
#
#   synui-wpengine  (synui 409)      mpv asks libavutil for a Vulkan hwdec
#   synstudio       (0.1.0-16)       QMediaPlayer builds one on construction
#   synstudio's own test suite       failed the BUILD on the laptop only
#
# Each fix was another DISABLE_MANGOHUD=1 in another launcher, and the next
# Vulkan client to arrive would have been the fourth. So it is OFF by default,
# and the hud comes from the launcher instead — which is where an overlay has
# to be turned on anyway, since nothing can inject one into a process that is
# already running:
#
#     syn game steam           the whole library inherits it
#     syn game -- ./game       a bare binary
#     syn game -- wine foo.exe  a wine title
#     synui-game-run --help    every option (gamescope, no-hud, no-gamemode)
#
# ⚠ TURNING THIS ON IS A PER-MACHINE CHOICE, NOT A BAD ONE. On an NVIDIA box
# the crash class above has never been seen, and "every launcher, no wrapper"
# is genuinely convenient. It is the default that was wrong, not the option.
#
#     syn game hud on      # or edit the line below; either takes effect at
#     syn game hud off     # the next login, because the session reads it once
#     syn game hud status
#
# A per-user copy at ~/.config/synapseos/mangohud.conf wins over this file
# entirely — that is what `syn game hud` writes, so one user opting in does not
# change the machine for everybody.
#
# The overlay itself stays hidden until Shift_R+F12 either way; that is
# /etc/MangoHud.conf's job, not this file's.

MANGOHUD_EVERYWHERE=0
