# SynapseOS laptop lid policy.
#
# These are systemd-logind's own defaults, set explicitly so the behaviour is
# SynapseOS policy rather than whatever a future systemd ships — a laptop's
# lid is not something to leave to a default that can change underneath us.
#
# Closing the lid suspends, on battery and on AC alike. synui locks before the
# machine goes down (logind.c takes a delay inhibitor on PrepareForSleep and
# runs the native lock, then releases it), so a resume always comes back to the
# lock screen — the "lock first" half of this is the compositor's, not here.
#
# Docked (an external display driving the session) is the exception: the lid is
# ignored so a closed-lid, external-monitor setup keeps running.
#
# THESE ARE THE FALLBACK, NOT THE SETTING ANYONE EDITS. While synui is running
# it takes logind's handle-lid-switch *block* inhibitor and acts on the lid
# itself, so all three lines below are overridden by the matching synui
# setting — `lid_close_action` / `lid_close_ac_action` /
# `lid_close_docked_action` in synuirc, or the Super+P panel, which is where a
# user changes this. They default to exactly what this file says, so the two
# agree until someone deliberately changes one.
#
# This file still matters, which is why it is not deleted:
#   - it handles the lid before synui starts, at the greeter, and if synui is
#     not running or has died (the inhibitor dies with the process, so logind
#     takes the lid straight back);
#   - a synui lid row set to `system` is resolved by *reading the value here*
#     over sd-bus and doing that, so these lines stay meaningful even while
#     synui holds the lid for the other two rows.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
