<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- INK VARIANT — deeper violet #5b21b6, for PALE surfaces.
       #a78bfa is a light violet drawn for dark grounds; on a light theme's panel
       it measures about 2.4:1, which is not a legible mark, it is a smudge. This
       is the same geometry in the ink colourway branding/logo/README.md defines
       for light stock: about 8:1 on the same surface. The containment triangle's
       opacity is lifted 0.4 -> 0.65 with it, because a hairline that was already
       faint on black disappears entirely once the ground is bright.
       Keep the geometry in step with logo.svg / logo-bold.svg — only the colour
       and that one opacity differ. -->
  <!-- Transparent variant of the SynapseOS dendrite mark (background rect
       removed) for compositing onto synui UI panels. Keep in sync with
       /usr/share/synapseos/logo.svg. -->
  <g transform="translate(512,512)">
    <!-- faint triangle containment -->
    <polygon points="0,-464 400,272 -400,272" fill="none" stroke="#5b21b6" stroke-width="2" opacity="0.65"/>

    <!-- central node -->
    <circle cx="0" cy="-48" r="36" fill="#5b21b6"/>

    <!-- three primary branches -->
    <line x1="0" y1="-48" x2="0" y2="-416" stroke="#5b21b6" stroke-width="8"/>
    <line x1="0" y1="-48" x2="288" y2="192" stroke="#5b21b6" stroke-width="8"/>
    <line x1="0" y1="-48" x2="-288" y2="192" stroke="#5b21b6" stroke-width="8"/>

    <!-- two inner branches, now straight and angled wider away from the primaries near the top -->
    <line x1="0" y1="-48" x2="176" y2="200" stroke="#5b21b6" stroke-width="4.4"/>
    <line x1="0" y1="-48" x2="-176" y2="200" stroke="#5b21b6" stroke-width="4.4"/>

    <!-- primary terminal nodes -->
    <circle cx="0" cy="-416" r="17.6" fill="#5b21b6"/>
    <circle cx="288" cy="192" r="17.6" fill="#5b21b6"/>
    <circle cx="-288" cy="192" r="17.6" fill="#5b21b6"/>

    <!-- inner branch terminal nodes -->
    <circle cx="176" cy="200" r="12.8" fill="#5b21b6"/>
    <circle cx="-176" cy="200" r="12.8" fill="#5b21b6"/>
  </g>
</svg>
