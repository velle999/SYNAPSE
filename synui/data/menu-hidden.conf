# synui start menu — entries not to list.
#
# One .desktop id per line; '#' comments; a leading '!' UN-hides an id a
# previously-read file hid. Two files are read, in this order:
#
#   /usr/share/synui/menu-hidden.conf    this one, shipped and curated
#   ~/.config/synui/menu-hidden.conf     yours, read second, so it wins
#
# Nothing here is uninstalled or disabled — the .desktop file is untouched and
# the application still launches from a terminal, from synfiles, or from the
# dock. This only decides what the start menu lists.
#
# To put one back, add its line to YOUR file with a '!' in front:
#
#   !lstopo
#
# ── What belongs here ───────────────────────────────────────────────────────
#
# Diagnostic and demo satellites: a program a LIBRARY installs so its own
# developers can poke at it, which arrives on the box because something else
# depends on that library. They are real applications and they run — they are
# simply not things anyone goes to a start menu for, and on a stock install
# they outnumber the applications the user chose.
#
# Shapes of non-application that CANNOT be enumerated — uninstallers, shortcuts
# to a readme or a web page, SDK tooling inside a Wine prefix — are matched by
# pattern in StartMenu.qml's isNoise() instead. Every Wine prefix invents new
# ones, so a list could never keep up. Do not duplicate that work here.
#
# What does NOT belong here: anything somebody might actually open. Qt Designer,
# Qt Linguist, Qt Assistant and CMake are development tools, not satellites, and
# they stay listed under Development.

# avahi — the mDNS browsers shipped as examples with the daemon.
avahi-discover
bssh
bvnc

# hwloc — prints a picture of the machine's CPU topology. Arrives with almost
# any HPC or compiler toolchain.
lstopo

# OpenJDK — the JVM's own monitoring console and its REPL. Neither is an
# application in the sense a menu means; both arrive with any JRE.
jconsole-java-openjdk
jshell-java-openjdk

# Qt — the bus inspector and the two V4L2 test harnesses. Debug tools that come
# in with qt6-tools / qt6-multimedia, unlike Designer and Linguist above.
qdbusviewer
qv4l2
qvidcap

# KDE Connect's tray indicator — the same application as org.kde.kdeconnect.app,
# started differently. Listing both makes it look like there are two.
org.kde.kdeconnect.nonplasma
