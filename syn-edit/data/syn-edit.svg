<?xml version="1.0" encoding="UTF-8"?>
<!-- syn-edit — a sheet of text with a block caret on it.

     The block caret is the whole point: it is what a modal editor looks like,
     and it distinguishes this from every other document icon at a glance. In
     the dendrite purple the rest of the suite uses (#a78bfa), so syn-edit,
     synfiles and syn-disks read as one family in the dock. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- the sheet -->
  <path d="M11 5h18l8 8v30a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"
        fill="#2a2438" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round"/>
  <!-- the folded corner -->
  <path d="M29 5v8h8" fill="none" stroke="#a78bfa" stroke-width="2"
        stroke-linejoin="round"/>
  <!-- lines of text, shortest last so it reads as a paragraph -->
  <g stroke="#6b6480" stroke-width="2" stroke-linecap="round">
    <line x1="15" y1="21" x2="31" y2="21"/>
    <line x1="15" y1="27" x2="33" y2="27"/>
    <line x1="15" y1="33" x2="24" y2="33"/>
  </g>
  <!-- the block caret, sitting at the end of the last line -->
  <rect x="27" y="29.5" width="6" height="7" rx="1" fill="#a78bfa"/>
</svg>
