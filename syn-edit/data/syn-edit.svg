<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- ⚠ This comment lives INSIDE <svg>, and every comment in this file has
       to stay here. gdk-pixbuf identifies an image by SNIFFING ITS FIRST 256
       BYTES for a format signature, and librsvg's signature is the literal
       "<svg". A header comment before the root element pushes "<svg" past
       byte 256, and the file stops being an SVG as far as GTK is concerned:

         gdk-pixbuf-error-quark: Couldn't recognize the image file format

       Not a parse error and not a warning — a blank square in the GNOME app
       grid, which is exactly what this icon was until 2026-08-18. It never
       showed on synui or KDE, because Qt parses the XML properly instead of
       sniffing it, so the whole class of bug is invisible on a Qt desktop.
       tools/preflight.sh checks the byte offset on every commit. -->
  <!-- syn-edit — a sheet of text with a block caret on it.

       The block caret is the whole point: it is what a modal editor looks like,
       and it distinguishes this from every other document icon at a glance. In
       the dendrite purple the rest of the suite uses (#a78bfa), so syn-edit,
       synfiles and syn-disks read as one family in the dock. -->
  <!-- the sheet -->
  <path d="M11 5h18l8 8v30a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"
        fill="#2a2438" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round"/>
  <!-- the folded corner -->
  <path d="M29 5v8h8" fill="none" stroke="#a78bfa" stroke-width="2"
        stroke-linejoin="round"/>
  <!-- lines of text, shortest last so it reads as a paragraph -->
  <g stroke="#6b6480" stroke-width="2" stroke-linecap="round">
    <line x1="15" y1="21" x2="31" y2="21"/>
    <line x1="15" y1="27" x2="33" y2="27"/>
    <line x1="15" y1="33" x2="24" y2="33"/>
  </g>
  <!-- the block caret, sitting at the end of the last line -->
  <rect x="27" y="29.5" width="6" height="7" rx="1" fill="#a78bfa"/>
</svg>
