# Installed as
#   /usr/lib/systemd/user/app-dev.lizardbyte.app.Sunshine.service.d/syn-remote.conf
#
# ⛔ ONE SUNSHINE, AND IT IS syn-remote-stream.service. sunshine's own menu entry,
# "Sunshine", runs `systemctl start --u app-dev.lizardbyte.app.Sunshine`, and the
# unit that starts is a SECOND server: it reads ~/.config/sunshine/sunshine.conf,
# so it has no `capture = wlr` and no prep hook, and it has no pairing state,
# because syn-remote keeps that in a file of its own. Measured on the reference
# desktop: with syn-remote-stream stopped it took every port, and a client that had
# been streaming minutes earlier was told "Client certificate identity is not
# paired" every three seconds; with syn-remote-stream running, the second server
# dies at "Couldn't bind RTSP server to port [48010]". Either way the menu entry
# breaks streaming. So the stock unit no longer runs sunshine at all: starting it
# starts syn-remote-stream.service, the server every client is paired with.
#
# ⚠ Wants=, NOT A Conflicts= ON OUR UNIT. A conflict would make the menu entry
# STOP the paired server in order to start the unpaired one, which is the failure
# above made deliberate.
[Unit]
Description=Sunshine (served by syn-remote-stream.service on SynapseOS)
Wants=syn-remote-stream.service

[Service]
Type=oneshot
ExecStartPre=
ExecStart=
ExecStart=/usr/bin/true
Restart=no
