PACKAGE_NAME="synapse_kmod"
PACKAGE_VERSION="0.1.0"
BUILT_MODULE_NAME[0]="synapse_kmod"
DEST_MODULE_LOCATION[0]="/extra"
AUTOINSTALL="yes"
# Build in DKMS's per-kernel build/ dir, NOT source/ — source/ is a symlink to the
# shared /usr/src tree, so building there leaves .o files behind that the next
# kernel's build reuses, silently producing a module with the OLD vermagic.
MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
