# /usr/lib/sysctl.d/90-synapse-hardening.conf
# SynapseOS kernel hardening — shipped with synapse_kmod.
#
# Reduces the local kernel attack surface that a hijack/rootkit relies on.
# Override any line in /etc/sysctl.d/ (higher-numbered file wins).

# Do not leak kernel pointer values to userspace (%pK). At 0 they appear in
# /proc/kallsyms, /proc/modules, etc., handing an attacker exploit targets.
# SynapseOS audit found this at 0 on live systems.
kernel.kptr_restrict = 2

# Restrict dmesg (kernel log) reads to root — it exposes addresses and probe
# activity. Defense in depth; usually already set.
kernel.dmesg_restrict = 1

# Refuse loading a replacement kernel via kexec at runtime. Closes a
# kexec-based persistence/bypass vector. One-way latch until reboot; harmless
# on a desktop with no kdump/kexec-reboot workflow.
kernel.kexec_load_disabled = 1

# ── Added 2026-08-10 after a Lynis 3.1.7 audit (index 66) ───────────────────

# systemd's own /usr/lib/sysctl.d/50-coredump.conf sets this to 2, and the live
# audit found 2: a setuid binary that crashes writes a core owned by root, and
# whatever it had in memory — password, key material, ticket — lands on disk.
# We sort at 90, so this wins. Non-setuid programs still dump normally.
fs.suid_dumpable = 0

# Refuse a FIFO/regular-file open through a world- or group-writable sticky
# directory (/tmp, /var/tmp, /dev/shm) when the opener is not the owner. This
# is the file-based half of the same race protected_symlinks/hardlinks already
# cover; both were at the weaker 1 (world-writable only) rather than 2.
fs.protected_fifos = 2
fs.protected_regular = 2

# Do not autoload a TTY line discipline on TIOCSETD. Line disciplines are old,
# rarely-audited kernel code reachable from any process holding a tty, and have
# produced a long run of local privilege escalations. Nothing on a desktop
# switches discipline at runtime.
dev.tty.ldisc_autoload = 0

# ── Network: this is a desktop, not a router ────────────────────────────────

# ICMP redirects rewrite our routing table on the word of anything that can put
# a packet on the wire. Accept none, and never emit them.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Reverse-path filter in LOOSE mode (2), deliberately NOT the strict 1 that
# Lynis asks for. Strict RPF drops any packet arriving on an interface that is
# not the one we would route its source back through, which breaks VPNs, policy
# routing and multi-homing — all of which this machine does. Loose still drops
# a source address that is unroutable by ANY interface, which is the spoofing
# case worth catching.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Harden the BPF JIT against spraying (constant blinding). 1 = unprivileged
# only, which is already belt-and-braces given unprivileged_bpf_disabled=2
# below. Deliberately NOT 2 ("all users"): synguard's own BPF-LSM programs
# would pay the blinding cost, and this stack has already dropped 80% of a
# burst once for want of throughput. See project-synguard-event-burst-capacity.
net.core.bpf_jit_harden = 1

# ── Deliberately NOT set — do not "fix" these ───────────────────────────────
#
#   kernel.modules_disabled = 1
#       A one-way latch that stops ALL module loading until reboot. It would
#       break DKMS, synapse_kmod's own reload, and NVIDIA. The opt-in
#       synapse-lock-modules.service in this package is the supported way to
#       do this, with the caveats documented in HARDENING.md.
#
#   kernel.sysrq = 0
#       We ship 16 (sync only). Lynis wants 0. Given this project's history of
#       VT-switch lockouts and suspend stalls, being able to force a sync
#       before a hard reset is worth more than the residual risk.
#
#   kernel.unprivileged_bpf_disabled
#       Already 2 (disabled, no recourse), which is STRICTER than the 1 Lynis
#       tests for. Its check is an equality test, not a floor.
#
#   net.ipv4.conf.*.log_martians = 1
#       Useful signal, but it belongs in synguard's netwatch feed rather than
#       spraying the journal. Revisit when there is a UI consuming it.
