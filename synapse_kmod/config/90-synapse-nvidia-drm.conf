# /usr/lib/modprobe.d/90-synapse-nvidia-drm.conf — shipped with synapse_kmod.
# SynapseOS: no fbdev emulation on the NVIDIA display driver.
#
# With fbdev=1 (the driver default), nvidia_drm runs a framebuffer console
# client, and every suspend hands the display back to it from inside the PM
# notifier:
#
#   pm_suspend -> nv_pm_notifier -> nv_drm_suspend_resume
#     -> drm_fb_helper_set_suspend_unlocked -> fbcon_switch -> fb_pan_display
#     -> nv_drm_atomic_commit -> nvSetDispModeEvo -> nvHdmiDpEnableDisableAudio
#     -> rpcRmApiControl_GSP -> kgspRecvPoll_IMPL
#
# On 615.71.09 that GSP RPC can go unanswered forever. The task spins holding
# the nvkms semaphore, the monitors stay dark, and the machine never reaches
# sleep. It stays awake and reachable over ssh, and a reboot is the only way
# out. With fbdev=0 that branch never runs.
#
# The cost is no text console on NVIDIA displays. synui owns the seat
# (Conflicts=getty@tty1), so that console is not shown during normal use. If
# synui fails to start, the screen stays black and the machine is reached over
# ssh. Intel and AMD displays keep their console; this only affects nvidia_drm.
options nvidia_drm fbdev=0
