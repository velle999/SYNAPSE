# /usr/lib/modprobe.d/90-synapse-blacklist.conf
# SynapseOS attack-surface reduction — shipped with synapse_kmod.
#
# Added 2026-08-10 after a Lynis 3.1.7 audit (NETW-3200, STRG-1846).
#
# Separate from synapse.conf on purpose: that file pins synapse_kmod's module
# PARAMETERS and is generated by the PKGBUILD. Mixing policy into it means a
# parameter change and a blacklist change cannot be reverted independently.
#
# `install <mod> /bin/false` is the load-refusing half; `blacklist` alone only
# suppresses alias-driven autoload and a direct `modprobe <mod>` still succeeds.
# To re-enable one of these, drop a file in /etc/modprobe.d/ — /etc wins.

# ── Exotic network protocols ────────────────────────────────────────────────
#
# Rarely-exercised kernel network stacks that autoload the moment any local
# process calls socket() with the matching family. Nothing on SynapseOS speaks
# them, and each one is a parser reachable pre-authentication.
install dccp /bin/false
install sctp /bin/false
install rds  /bin/false
install tipc /bin/false
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc

# ── FireWire / IEEE 1394 ────────────────────────────────────────────────────
#
# Not merely unused storage: 1394 grants DMA to the host by design, so a port
# left driverless is one less physical path to RAM. Covers both the modern
# firewire-* stack and the legacy ieee1394 one.
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
install ohci1394      /bin/false
install sbp2          /bin/false
install dv1394        /bin/false
install raw1394       /bin/false
install video1394     /bin/false
blacklist firewire-core
blacklist firewire-ohci
blacklist firewire-sbp2
blacklist ohci1394
blacklist sbp2

# ── Deliberately NOT blacklisted ────────────────────────────────────────────
#
#   usb-storage
#       Lynis USB-1000 asks for this. SynapseOS writes install media and boots
#       from USB as a routine part of its own release process; disabling it
#       would break the distro's primary workflow to close a threat model
#       (evil-maid mass storage) that physical access already defeats.
