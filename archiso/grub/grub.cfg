insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video

set default=synapseos
set timeout=5
set timeout_style=menu

if loadfont "${prefix}/fonts/unicode.pf2"; then
    set gfxmode="auto"
    terminal_input console
    terminal_output console
fi

menuentry "SynapseOS 0.2.9.5 — Where the kernel thinks." --class arch --class gnu-linux --id 'synapseos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "SynapseOS 0.2.9.5 (safe mode)" --class arch --class gnu-linux --id 'synapseos-safe' {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset console=ttyS0 console=tty0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "SynapseOS 0.2.9.5 (debug)" --class arch --class gnu-linux --id 'synapseos-debug' {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

# ── Language ───────────────────────────────────────────────────────────────
#
# The same fifteen rows as syn-install's LOCALE_ROWS, each booting the ordinary
# live image with `lang=` on the command line. syn-install reads it off
# /proc/cmdline and skips its own language question, so a choice made here
# reaches the console keymap, the live desktop's keyboard layout, the installer
# and synsh — and nobody is asked twice.
#
# Taking the plain entry above is not a worse path: with no `lang=` the live
# image opens with the same list as its first screen. This exists for the
# person who cannot read the language that screen would otherwise open in, and
# that is why the names are written in each language rather than in English.
#
# ⚠ THE NATIVE NAMES ARE ONLY POSSIBLE HERE. The syslinux copy of this menu
# (syslinux/archiso_lang.cfg) is ASCII, because vesamenu.c32 draws from a fixed
# VGA codepage; GRUB has loaded unicode.pf2 above, so it can draw 日本語 and
# العربية and this is the one screen on the whole image that can.
submenu "Language · Sprache · Langue · Idioma · 语言 · 日本語" --class arch --id 'language' {
    menuentry "English (US)" --class arch --class gnu-linux {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash lang=en_US.UTF-8
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }
    menuentry "English (UK)" --class arch --class gnu-linux {
        set gfxpayload=keep
