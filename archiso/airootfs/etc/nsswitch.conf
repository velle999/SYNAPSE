# SynapseOS nsswitch.conf.
#
# Arch's default, plus mdns_minimal for nss-mdns: cups discovers a driverless
# printer over mDNS and is then handed the printer's own <name>.local address —
# which resolves to nothing without this, so discovery works and printing still
# fails. mdns_minimal only answers .local and defers everything else, and
# [NOTFOUND=return] stops a miss there from falling through to DNS (which would
# leak every .local lookup to the network and stall on the timeout).
passwd: mymachines files systemd
group: mymachines files [SUCCESS=merge] systemd
shadow: files systemd
gshadow: files systemd

publickey: files

hosts: mymachines resolve [!UNAVAIL=return] files myhostname mdns_minimal [NOTFOUND=return] dns
networks: files

protocols: files
services: files
ethers: files
rpc: files

netgroup: files
