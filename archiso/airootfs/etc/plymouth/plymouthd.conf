# Which boot splash plymouth draws. THIS FILE is the mechanism — not the
# themes/default.plymouth symlink next to the theme, which nothing reads.
#
# plymouth-set-default-theme (called with no arguments by the mkinitcpio
# `plymouth` hook, to decide what to copy into the initramfs) resolves the theme
# in exactly two places, in this order:
#
#   1. /etc/plymouth/plymouthd.conf          [Daemon] Theme=      <- here
#   2. /usr/share/plymouth/plymouthd.defaults                     <- Arch's
#
# Arch's default is `Theme=bgrt`, and bgrt is the theme that deliberately draws
# the FIRMWARE's own boot logo out of the ACPI BGRT table, falling back to the
# distro spinner. So with this file absent the ISO booted to the manufacturer's
# logo and then Arch's — not because the SynapseOS theme was broken, but because
# it was never selected, and therefore never copied into the initramfs at all.
[Daemon]
Theme=synapseos
