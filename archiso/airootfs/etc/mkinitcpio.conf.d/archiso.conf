# No 'kms' hook: it loads nouveau from the initramfs, and on NVIDIA the
# card must stay free for the nvidia driver (synui has no EGL on nouveau).
# synui-gfx-env modprobes nouveau later on cards nvidia-open can't drive.
HOOKS=(base udev plymouth microcode modconf memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
