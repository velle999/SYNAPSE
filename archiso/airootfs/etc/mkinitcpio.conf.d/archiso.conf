# No 'kms' hook: it loads nouveau from the initramfs, and on NVIDIA the
# card must stay free for the nvidia driver (synui has no EGL on nouveau).
# synui-gfx-env modprobes nouveau later on cards nvidia-open can't drive.
# ⛔ `kms` IS WHY THE SPLASH WAS STRETCHED. Without it the DRM driver is not in
# the initramfs, so early boot runs on efifb at whatever mode the firmware's GOP
# handed to GRUB — frequently 1024x768, which is 4:3. `gfxpayload=keep` passes
# that straight through, and a 1440p panel stretches it across the whole screen:
# the logo, the text, everything, uniformly wide. velle, 2026-08-28: "iso boot
# logo was stretched wide on 1440."
#
# With `kms` the real driver loads before plymouth draws, sets the panel's own
# native mode, and the splash is drawn at the aspect the monitor actually has.
# It is also what removes the mode change partway through boot.
#
# ⚠ THE SAFE-MODE ENTRY IS UNAFFECTED — it passes `nomodeset`, which is the
# point of it, and skips all of this.
HOOKS=(base udev kms plymouth microcode modconf memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
