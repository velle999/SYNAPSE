# cups.socket only listens on the unix socket (/run/cups/cups.sock) out of the
# box, so the web admin UI at http://localhost:631/ — the whole printer story on
# SynapseOS, opened from the start menu and the control panel — can never
# connect: a browser hitting a TCP port does not touch the unix socket, so it
# never socket-activates cupsd either.
#
# ListenStream is a list, so this appends a loopback TCP listener to the unix
# one rather than replacing it. Socket activation is preserved: cupsd still does
# not run until localhost:631 (or a print job) is actually touched. Loopback
# only — the box is not a print server for the network.
[Socket]
ListenStream=127.0.0.1:631
ListenStream=[::1]:631
