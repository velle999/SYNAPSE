[Service]
ExecStart=
# --noissue, on tty1 only.
#
# agetty prints /etc/issue before it logs anyone in, autologin included, and
# /etc/issue is the full dendrite mark in plain white on black. Then this getty
# autologins root, /root/.bash_profile runs syn-firstboot, and that hands
# straight to `syn-install --live`, whose header() clears the screen and draws
# the SAME mark again in cyan. Two nearly identical branded screens for one
# decision, the first one dead for the second or two the handover takes.
#
# So the issue file is suppressed HERE rather than trimmed: it is the banner on
# tty2-tty6 and over serial, where nothing else draws one, and the installed
# system keeps it (syn-install copies issue and motd to the target). This
# drop-in only covers the one VT that has a branded screen of its own coming.
ExecStart=-/sbin/agetty --autologin root --noclear --noissue %I $TERM
