# Compressed swap for the LIVE environment. See zram-generator.conf(5).
#
# The live root is an overlay in RAM, and the installer runs a compositor, a
# browser-class QML shell and pacstrap on top of it. On a 4 GiB machine that is
# where an install dies. Same shape as the config syn-install writes for the
# installed system, so the behaviour a user sees on the ISO is the behaviour
# they get afterwards.
#
# Without this file the generator does nothing at all — it reports "No
# configuration found" and emits zero units, so shipping the package alone
# would have looked done and changed nothing.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
