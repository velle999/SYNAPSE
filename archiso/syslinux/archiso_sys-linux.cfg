# WARNING: the LABEL ids below stay `arch` and `archspeech`. They are not branding --
# archiso_sys.cfg selects the default with `DEFAULT arch`, and renaming one here
# without the other gives a menu that boots nothing on timeout. Only the
# human-visible MENU LABEL and TEXT HELP lines are ours to change.
LABEL arch
TEXT HELP
Boot the SynapseOS live medium on BIOS.
Try the desktop, install to disk, or use it to repair an existing system.
ENDTEXT
MENU LABEL SynapseOS 0.2.9.2 - Where the kernel thinks. (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200 console=tty0 quiet splash

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot SynapseOS on BIOS with the speakup screen reader.
The same live medium, with speech feedback.
ENDTEXT
MENU LABEL SynapseOS 0.2.9.2 (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
