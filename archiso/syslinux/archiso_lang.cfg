# archiso_lang.cfg -- pick a language before the system boots (BIOS/syslinux).
#
# Every entry is the ordinary live boot with `lang=` added. syn-install reads it
# off /proc/cmdline and skips its own language question, so choosing here means
# the console keymap, the live desktop's keyboard, the installer and synsh are
# all in that language from the first screen onward, and nobody is asked twice.
#
# Booting the plain entry instead is not a worse path: with no `lang=` the live
# image asks, in a menu that is the first thing on the screen. This exists for
# the person who cannot read the language that menu would open in.
#
# !! ASCII ONLY IN THIS FILE. vesamenu.c32 draws from a fixed VGA codepage, so
# "Francais" is written without its cedilla on purpose -- a UTF-8 character here
# is not a character that renders plainly, it is bytes that render as noise.
# grub.cfg carries the same menu WITH the accents and the CJK names, because
# GRUB loads unicode.pf2 and can draw them. Same choice, made twice, because
# the two loaders can do different things.
#
# !! AND THE LOCALES MUST MATCH syn-install's LOCALE_ROWS, which is the table
# that has to recognise what is passed. A code not in that table is not an
# error -- locale_row_for() returns nothing and the live image asks -- but it is
# a boot entry that quietly does nothing, which is worse than not having it.

MENU BEGIN language
MENU TITLE Language / Sprache / Langue / Idioma

LABEL lang_en_us
MENU LABEL English (US)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200 console=tty0 quiet splash lang=en_US.UTF-8

