# Installed as
#   /usr/lib/systemd/system/systemd-boot-random-seed.service.d/syn-boot-seed.conf
# by the syn package.
#
# Refresh the ESP random seed only when the running boot loader reads one.
# limine sets LoaderFeatures without the random-seed bit, so on a limine install
# the unit skips instead of writing a seed nothing reads (and logging two
# "world accessible" errors about it). systemd-boot and systemd-stub set the bit
# and run it as before. See /usr/lib/syn/syn-boot-seed.
[Service]
ExecCondition=/usr/lib/syn/syn-boot-seed
