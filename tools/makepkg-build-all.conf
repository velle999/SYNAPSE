# makepkg-build-all.conf — makepkg's configuration when build-all.sh runs it.
#
# Everything makepkg reads when it is given no --config — /etc/makepkg.conf, its
# .d fragments, then the user's own file — in that order, with one change after
# it. (--config would otherwise skip the user's file: makepkg reads that only
# for the default path.)
#
# ⛔ THE CHANGE: sudo -n, where makepkg's default is `sudo -k`. -k throws the
# cached password away, so a build that needs a missing makedepends installed
# stops at a password prompt in the middle of an unattended update — however
# recently the password was typed, and syn-update keeps it fresh every minute.
# Nobody answers, sudo gives up after five minutes, and pam_faillock counts
# that as a WRONG PASSWORD: three of them lock the account. chibi 38 did exactly
# this on the ThinkPad (python-setuptools, 2026-09-22). -n uses the ticket
# syn-update holds, and when there is none it refuses at once, before PAM, so
# nothing is counted.
#
# SynapseOS Project
# SPDX-License-Identifier: GPL-2.0-or-later

source /etc/makepkg.conf
for _synconf in /etc/makepkg.conf.d/*.conf; do
    [ -r "$_synconf" ] && source "$_synconf"
done
if [ -r "${XDG_CONFIG_HOME:-$HOME/.config}/pacman/makepkg.conf" ]; then
    source "${XDG_CONFIG_HOME:-$HOME/.config}/pacman/makepkg.conf"
elif [ -r "$HOME/.makepkg.conf" ]; then
    source "$HOME/.makepkg.conf"
fi
unset _synconf

PACMAN_AUTH=(sudo -n)
