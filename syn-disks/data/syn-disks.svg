<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- ⚠ This comment lives INSIDE <svg>, and every comment in this file has
       to stay here. gdk-pixbuf identifies an image by SNIFFING ITS FIRST 256
       BYTES for a format signature, and librsvg's signature is the literal
       "<svg". A header comment before the root element pushes "<svg" past
       byte 256, and the file stops being an SVG as far as GTK is concerned:

         gdk-pixbuf-error-quark: Couldn't recognize the image file format

       Not a parse error and not a warning — a blank square in the GNOME app
       grid, which is exactly what this icon was until 2026-08-18. It never
       showed on synui or KDE, because Qt parses the XML properly instead of
       sniffing it, so the whole class of bug is invisible on a Qt desktop.
       tools/preflight.sh checks the byte offset on every commit. -->
  <!-- syn-disks — the SynapseOS disk utility.

       A drive seen edge-on with its platter, in the dendrite purple the rest of
       the suite uses. Deliberately NOT the theme's drive-harddisk: on Breeze
       that is the same face every removable device in the dock already wears,
       and synfiles learned the hard way (pkgrel 21) that shipping a stock icon
       name puts two applications in the dock wearing one face.

       Scalable only. Qt renders this at whatever size the dock asks for.
  -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c5cd6"/>
    </linearGradient>
  </defs>

  <!-- the drive body -->
  <rect x="6" y="11" width="36" height="26" rx="4" fill="url(#body)"/>

  <!-- the platter, offset the way a drive's spindle actually sits -->
  <circle cx="24" cy="24" r="9" fill="none" stroke="#1b1030" stroke-width="2.2"/>
  <circle cx="24" cy="24" r="2.6" fill="#1b1030"/>

  <!-- the head arm -->
  <path d="M33 15 L27.5 21.5" stroke="#1b1030" stroke-width="2.2" stroke-linecap="round"/>

  <!-- activity light -->
  <circle cx="11" cy="33" r="1.7" fill="#4ec9b0"/>
</svg>
