# The unprivileged user synapd runs as. It exists so the daemon that parses
# untrusted socket input is not root -- see synapd-setup.service.
u synapd - "SynapseOS AI daemon" /var/lib/synapd -

# The CLIENT group -- "may talk to synapd". It owns the socket
# (synapd.socket's SocketGroup=synapse) and the two directories synui reads
# models out of (tmpfiles/synapd.conf), and the installer puts the login user
# in it.
#
# It is declared HERE, and not only by whoever creates it imperatively, because
# pacman runs 20-systemd-sysusers.hook before 21-systemd-tmpfiles.hook: a group
# that exists at package-install time is a group tmpfiles can resolve. Until
# this line existed, `groupadd -r synapse` lived in syn-install.sh and the ISO's
# customize_airootfs.sh ONLY -- both of which run long AFTER the packages go in
# -- so every install logged, from the tmpfiles hook:
#
#   /usr/lib/tmpfiles.d/synapd.conf:22: Failed to resolve group 'synapse'
#   /usr/lib/tmpfiles.d/syn-model.conf:7: Failed to resolve group 'synapse'
#
# and /var/lib/synapd was left for the boot-time tmpfiles run to repair. On a
# machine that never runs our installer at all (`synpkg install synapd` on
# stock Arch) nothing created it, so the socket's SocketGroup could not resolve
# either. Seen on a real install 2026-08-14.
g synapse -
