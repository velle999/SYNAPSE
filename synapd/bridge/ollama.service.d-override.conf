[Unit]
# Never open the port before the rules that fence it off are loaded -- and never
# open it at all if they could not be. Requires= (not Wants=) is the difference:
# Wants= only orders, so a guard that FAILED still let ollama bind 0.0.0.0:11434
# and hand an unauthenticated model API to the whole subnet. Matches the
# synapd-bridge.socket guard, which got this right.
Requires=ollama-guard.service
After=ollama-guard.service

[Service]
# chibi runs on raspberrypi.lan and reaches this box at 192.168.40.153:11434
# (see chibi-llm config.py: llm_host / llm_port). ollama-guard.service is what
# keeps this from being open to the whole LAN.
Environment="OLLAMA_HOST=0.0.0.0:11434"
