# /usr/lib/systemd/system/nvidia-persistenced.service.d/50-synapse-hardening.conf
#
# Sandbox NVIDIA's stock nvidia-persistenced.service. Added 2026-08-10 after a
# Lynis 3.1.7 audit: `systemd-analyze security` scored it 9.6 UNSAFE, the worst
# unit on the system by a wide margin. NVIDIA's file is a documented *sample*
# ("This is a sample systemd service file, designed to show how..."), so it
# ships with no hardening at all.
#
# WHY THIS LIVES IN synapd
#
# nvidia-persistenced is not enabled on SynapseOS — it is pulled in by
# synapd-setup.service's Wants=. We are the reason it runs, so we own its
# posture. Shipping the drop-in from this package also means pacman tracks it,
# it survives a reinstall, and it reaches the ISO — none of which is true of a
# hand-placed file in /etc/systemd/system/. (A user override still wins: /etc
# is read after /usr/lib. See reference-systemd-etc-shadows-usr-lib.)

[Service]

# ── The one that needs justifying: NoNewPrivileges ──────────────────────────
#
# nvidia-persistenced does not link libnvidia-cfg; it dlopen()s it, and that
# library execs the SETUID /usr/bin/nvidia-modprobe to create /dev/nvidia*
# when they are missing. NoNewPrivileges neuters setuid, so this would remove
# that self-heal path.
#
# It is safe here because nothing depends on that path: Arch's nvidia-utils
# ships /usr/lib/udev/rules.d/60-nvidia.rules, which runs nvidia-modprobe from
# udev (as root, unsandboxed) on `add|bind` of the nvidia-driven GPU. The nodes
# therefore exist before persistenced is ever started. Verified on this
# machine: /dev/nvidia0, nvidiactl, nvidia-modeset, nvidia-uvm, nvidia-caps/*.
#
# Stated explicitly rather than left implicit, because most of the directives
# below imply it anyway and a future reader deserves to see the decision.
NoNewPrivileges=true

# ── Filesystem ──────────────────────────────────────────────────────────────
#
# `full`, deliberately NOT `strict`: the daemon creates and chowns
# /var/run/nvidia-persistenced (socket + pidfile), and ExecStopPost rm -rf's it.
# strict would make /var read-only and break both.
ProtectSystem=full
ProtectHome=true
PrivateTmp=true

# ── Kernel-facing ───────────────────────────────────────────────────────────
#
# ProtectKernelTunables is safe despite libnvidia-cfg reading
# /sys/devices/system/memory/auto_online_blocks — it makes /sys read-only, not
# unreadable.
ProtectClock=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectHostname=true

# ── Process / syscall ───────────────────────────────────────────────────────
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native

# Local only: a UNIX socket under /var/run and netlink. A persistence daemon
# has no business opening AF_INET.
RestrictAddressFamilies=AF_UNIX AF_NETLINK

# Enough to drop from root to the nvidia-persistenced user and own its runtime
# directory, and nothing else. This is the highest-risk line in the file: if
# the daemon ever fails to start after a driver bump, comment it out FIRST and
# re-measure before suspecting anything above.
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER

# ── Deliberately NOT set ────────────────────────────────────────────────────
#
#   PrivateDevices=true
#       Hard break. The entire job is holding /dev/nvidia* open; a private /dev
#       has no GPU nodes in it. This is the single directive that costs the
#       most score here and it is simply not available to us.
#
#   ProtectSystem=strict — see above, /var/run.
#
#   MemoryDenyWriteExecute=true
#       Untested against NVIDIA's closed userspace, which has historically
#       wanted W+X mappings. Bad risk/reward for a daemon that is already
#       unprivileged after startup.
#
#   User=
#       It drops privileges itself via `--user nvidia-persistenced`. Setting
#       User= would take away the CAP_SETUID it needs to do that.
