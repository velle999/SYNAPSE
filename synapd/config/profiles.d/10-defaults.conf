# synapd — per-model sampling profiles (shipped defaults)
#
# A GGUF tells synapd how to FRAME a prompt (tokenizer.chat_template). It says
# nothing about how to SAMPLE one, and the right answer differs per family.
# These are the published recommendations from each model's own card.
#
# Section name = a case-insensitive substring matched against the model's
# general.basename, general.name, then general.architecture.
#
# The LONGEST matching section wins — [mistral-nemo] beats [mistral] no matter
# which file each is in, so dropping in a new profile cannot reorder existing
# ones. Ties go to /etc/synapd/profiles.d.
#
# DO NOT EDIT THIS FILE — it is replaced on upgrade. To override, drop a file
# into /etc/synapd/profiles.d/ with the same section name.
#
# Keys: temperature, top_p, top_k. Anything omitted keeps synapd's default
# (0.8 / 0.95 / 40). A --temperature flag on the command line beats all of it.
#
# These values are a starting point from each model card, not measurements on
# your hardware. If a model feels too loose or too rigid, override it in /etc
# rather than editing here.

# ── Mistral ──────────────────────────────────────────────────────────────
# Mistral's general guidance is 0.7. Nemo is the exception: its card calls for
# a notably lower temperature, and it is the model SynapseOS ships.
[mistral]
temperature = 0.7
top_p = 0.95
top_k = 40

[mistral-nemo]
temperature = 0.3
top_p = 0.95
top_k = 40

# ── Qwen ─────────────────────────────────────────────────────────────────
# Qwen2.5 recommends a much tighter top_k than everyone else.
[qwen]
temperature = 0.7
top_p = 0.8
top_k = 20

# ── Llama ────────────────────────────────────────────────────────────────
[llama-3]
temperature = 0.6
top_p = 0.9
top_k = 40

# ── Gemma ────────────────────────────────────────────────────────────────
# Gemma is trained to be sampled hot; 0.8 makes it noticeably flat.
[gemma]
temperature = 1.0
top_p = 0.95
top_k = 64

# ── Phi ──────────────────────────────────────────────────────────────────
[phi]
temperature = 0.7
top_p = 0.9
top_k = 40
