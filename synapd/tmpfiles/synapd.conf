# /run/synapd holds the socket. systemd.socket creates the socket itself, but
# not its parent, and this runs before sockets.target.
d /run/synapd 0755 root root -

# Group `synapse`, not `synapd`, on the two directories a CLIENT has to reach.
#
# synui does not ask the daemon what models exist — it reads this directory
# itself, listing the .gguf files for the control-panel picker and opening each
# header for the size, quantisation and description the rows show. Running as
# the login user, it needs group search on /var/lib/synapd and group read on
# models/ to do any of that.
#
# `synapse` is already the group that means "may talk to synapd": it owns the
# socket (SocketGroup=synapse, see synapd.socket) and both the installer and the
# live ISO put the login user in it. Reusing it here keeps one answer to "who is
# a client", rather than inventing a second group that has to be kept in sync.
#
# Group READ only, and only these two. A model is a packaged artifact, not a
# secret; the conversation history under context/ is what privsep is protecting,
# and it stays synapd-only below. Anything that WRITES here — the downloader —
# still goes through the root unit and its polkit rule.
d /var/lib/synapd 0750 synapd synapse -
d /var/lib/synapd/models 0750 synapd synapse -
d /var/lib/synapd/context 0750 synapd synapd -
d /var/log/synapd 0750 synapd synapd -

# Re-own what already exists. These trees predate the unprivileged user: the
# installer and the ISO both drop the model in as root, and `d` only sets
# ownership on directories it creates. Without this, an upgraded box keeps a
# root-owned model that the synapd user cannot read.
#
# Named one path at a time rather than one `Z /var/lib/synapd`. A recursive
# re-own of the whole tree would walk straight back over the two `d` lines above
# and put models/ back in group synapd — which is exactly the bug this file is
# being edited to fix. These cover the same real content: the context history,
# the model files, and the remembered pick.
Z /var/lib/synapd/context - synapd synapd -
Z /var/log/synapd - synapd synapd -
z /var/lib/synapd/model.selected - synapd synapd -
z /var/lib/synapd/models/*.gguf 0644 synapd synapd -
