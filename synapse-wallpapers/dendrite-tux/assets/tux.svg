<svg xmlns="http://www.w3.org/2000/svg" width="420" height="520" viewBox="0 0 420 520">
  <!-- Tux, drawn to sit in front of the SynapseOS dendrite mark: Larry Ewing's
       proportions, but lit from behind by the logo's purple (#a78bfa) so he reads
       against the near-black #0a0a12 background instead of dissolving into it.

       Geometry notes, because these are what make him read as *Tux* rather than as
       a generic penguin, and they are the first things an edit loses:
         - head is ~180 wide over a ~292-wide body. The neck pinch at y=200 is the
           tell; widen the head and he turns into a bowling pin.
         - the eye whites lean top-inward, so a black wedge widens down between them
           to the bill. Straighten them and he goes cross-eyed.
         - the feet are FAT, wider than the body, and sit apart with the body's black
           bottom edge showing between them. They are drawn last, in front.
         - the flippers have to clear the body outline (x&lt;64) or they vanish into
           it; on this palette they also carry a lighter gradient of their own so the
           overlap still separates against the dark background. -->
  <defs>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0"   stop-color="#2a2a36"/>
      <stop offset="0.5" stop-color="#16161e"/>
      <stop offset="1"   stop-color="#0d0d14"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#272733"/>
      <stop offset="1"   stop-color="#101018"/>
    </linearGradient>
    <linearGradient id="belly" x1="0.3" y1="0" x2="0.8" y2="1">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="1"   stop-color="#d8d8e4"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffd84a"/>
      <stop offset="1"   stop-color="#f0a416"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffcf35"/>
      <stop offset="1"   stop-color="#e08f12"/>
    </linearGradient>

    <!-- One foot: the outline of a heel disc unioned with three tapered toes,
         generated rather than hand-drawn (see the note above). Origin is the heel
         centre; the toes fan out towards -x. -->
    <path id="tux-foot"
          d="M 65.5 0.0 C 65.5 2.0 65.3 4.0 64.8 5.9 C 64.3 7.8 63.6 9.8 62.6 11.6
              C 61.7 13.4 60.5 15.2 59.2 16.9 C 57.8 18.6 56.2 20.2 54.5 21.7 C 52.8
              23.2 50.8 24.6 48.8 25.9 C 46.8 27.1 44.6 28.3 42.4 29.3 C 40.1 30.3
              37.8 31.1 35.4 31.9 C 33.0 32.6 30.6 33.2 28.1 33.6 C 25.7 34.1 23.2
              34.3 20.7 34.6 C 18.3 34.8 15.9 34.5 13.7 35.2 C 11.4 35.9 9.6 37.3
              7.3 38.5 C 5.1 39.8 2.7 41.1 0.0 42.7 C -2.7 44.2 -5.6 46.0 -9.1 47.9
              C -12.6 49.8 -16.5 52.1 -21.1 54.3 C -25.7 56.5 -31.7 60.1 -36.7 61.1
              C -41.6 62.2 -46.5 61.5 -50.7 60.6 C -54.9 59.7 -58.9 57.9 -61.8 55.6
              C -64.7 53.4 -67.5 50.5 -68.2 47.1 C -68.8 43.6 -66.9 38.6 -65.7 34.8
              C -64.6 31.0 -60.3 26.8 -61.1 24.3 C -61.8 21.9 -65.9 21.5 -70.4 20.1
              C -74.8 18.8 -83.0 18.1 -87.7 16.2 C -92.5 14.4 -96.3 11.7 -98.7 9.0 C
              -101.0 6.3 -102.1 3.0 -102.1 0.0 C -102.1 -3.0 -101.0 -6.3 -98.7 -9.0
              C -96.3 -11.7 -92.5 -14.4 -87.7 -16.2 C -83.0 -18.1 -74.8 -18.8 -70.4
              -20.1 C -65.9 -21.5 -61.8 -21.9 -61.1 -24.3 C -60.3 -26.8 -64.6 -31.0
              -65.7 -34.8 C -66.9 -38.6 -68.8 -43.6 -68.2 -47.1 C -67.5 -50.5 -64.7
              -53.4 -61.8 -55.6 C -58.9 -57.9 -54.9 -59.7 -50.7 -60.6 C -46.5 -61.5
              -41.6 -62.2 -36.7 -61.1 C -31.7 -60.1 -25.7 -56.5 -21.1 -54.3 C -16.5
              -52.1 -12.6 -49.8 -9.1 -47.9 C -5.6 -46.0 -2.7 -44.2 -0.0 -42.7 C 2.7
              -41.1 5.1 -39.8 7.3 -38.5 C 9.6 -37.3 11.4 -35.9 13.7 -35.2 C 15.9
              -34.5 18.3 -34.8 20.7 -34.6 C 23.2 -34.3 25.7 -34.1 28.1 -33.6 C 30.6
              -33.2 33.0 -32.6 35.4 -31.9 C 37.8 -31.1 40.1 -30.3 42.4 -29.3 C 44.6
              -28.3 46.8 -27.1 48.8 -25.9 C 50.8 -24.6 52.8 -23.2 54.5 -21.7 C 56.2
              -20.2 57.8 -18.6 59.2 -16.9 C 60.5 -15.2 61.7 -13.4 62.6 -11.6 C 63.6
              -9.8 64.3 -7.8 64.8 -5.9 C 65.3 -4.0 65.5 -2.0 65.5 0.0 Z"/>
  </defs>

  <!-- body + head, one silhouette: dome head, neck pinch, pear body -->
  <path d="M210 22
           C 262 22, 300 68, 300 122
           C 300 152, 292 180, 278 200
           C 330 230, 356 300, 356 368
           C 356 434, 300 474, 210 474
           C 120 474, 64 434, 64 368
           C 64 300, 90 230, 142 200
           C 128 180, 120 152, 120 122
           C 120 68, 158 22, 210 22 Z"
        fill="url(#body)"/>

  <!-- belly: a teardrop — a narrow chest under the chin widening to a wide
       seat. An even oval here is what made him read as a generic penguin. -->
  <path d="M210 196
           C 242 196, 266 234, 280 284
           C 296 338, 306 390, 300 426
           C 292 458, 254 470, 210 470
           C 166 470, 128 458, 120 426
           C 114 390, 124 338, 140 284
           C 154 234, 178 196, 210 196 Z"
        fill="url(#belly)"/>

  <!-- flippers: drawn in FRONT of the body. Behind it they were invisible —
       black on black has no edge on this palette — so they carry a lighter
       gradient and a dark outline of their own. -->
  <g fill="url(#wing)" stroke="#08080e" stroke-width="2.5" stroke-linejoin="round">
    <path d="M134 228
             C 98 252, 62 314, 52 378
             C 46 412, 64 432, 86 424
             C 106 417, 124 370, 136 318
             C 145 278, 145 246, 134 228 Z"/>
    <path d="M286 228
             C 322 252, 358 314, 368 378
             C 374 412, 356 432, 334 424
             C 314 417, 296 370, 284 318
             C 275 278, 275 246, 286 228 Z"/>
  </g>

  <!-- eye whites: tall, leaning top-inward, with a black wedge between them -->
  <ellipse cx="178" cy="106" rx="28" ry="44" fill="#ffffff" transform="rotate(11 178 106)"/>
  <ellipse cx="242" cy="106" rx="28" ry="44" fill="#ffffff" transform="rotate(-11 242 106)"/>
  <ellipse cx="185" cy="103" rx="14.5" ry="16" fill="#0b0b11"/>
  <ellipse cx="235" cy="103" rx="14.5" ry="16" fill="#0b0b11"/>
  <circle  cx="180" cy="96" r="4.4" fill="#ffffff" opacity="0.92"/>
  <circle  cx="230" cy="96" r="4.4" fill="#ffffff" opacity="0.92"/>

  <!-- bill: a broad upper mandible over a darker lower one -->
  <path d="M210 126
           C 240 126, 262 139, 262 155
           C 262 166, 240 173, 210 175
           C 180 173, 158 166, 158 155
           C 158 139, 180 126, 210 126 Z"
        fill="url(#beak)" stroke="#b8710f" stroke-width="1.6"/>
  <path d="M160 161
           C 181 173, 239 173, 260 161
           C 257 178, 238 187, 210 187
           C 182 187, 163 178, 160 161 Z"
        fill="#e0921c" stroke="#b8710f" stroke-width="1.4"/>
  <ellipse cx="195" cy="140" rx="3.4" ry="2.3" fill="#a4650d" opacity="0.7"/>
  <ellipse cx="225" cy="140" rx="3.4" ry="2.3" fill="#a4650d" opacity="0.7"/>

  <!-- feet, in front of everything and splayed out from under the belly -->
  <g fill="url(#foot)" stroke="#a2600c" stroke-width="2.4" stroke-linejoin="round">
    <use href="#tux-foot" transform="translate(132 430) rotate(27)"/>
    <use href="#tux-foot" transform="translate(288 430) rotate(-27) scale(-1 1)"/>
  </g>
</svg>
